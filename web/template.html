<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGC: M365 Graph Cartographer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a working reference sheet for Microsoft 365 architects. Precise, calm, nothing decorative.
   IDEA: a surveyor's network plan. The circle is the drawing; the side panel is its title block and notes.
   PICTURE: radial spider diagram. Graph at the centre, workloads as stations, resources on the outer ring, relationships as chords.
   COLOUR and TYPE: stone ground, black ink, brick accent, white panels; workload hues as flat category colours. Schibsted Grotesk.
   LAYOUT: title bar and filters on top, the map fills the screen, notes panel on the right (below it on narrow screens). */
:root{color-scheme:light;--bg:#e7e4df;--ink:#141210;--mute:#5b554e;--panel:#fff;--soft:#f3f1ed;--rule:#d3cec6;--brick:#c8371e;--line:rgba(20,18,16,.30);--spoke:rgba(20,18,16,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#171513;--ink:#ece8e2;--mute:#a49d94;--panel:#211e1b;--soft:#2a2622;--rule:#3b3631;--brick:#ec6a49;--line:rgba(236,232,226,.30);--spoke:rgba(236,232,226,.15)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#171513;--ink:#ece8e2;--mute:#a49d94;--panel:#211e1b;--soft:#2a2622;--rule:#3b3631;--brick:#ec6a49;--line:rgba(236,232,226,.30);--spoke:rgba(236,232,226,.15)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
code{font:14px/1.45 ui-monospace,"Cascadia Mono",Consolas,monospace;overflow-wrap:anywhere}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--brick);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding:18px max(3vw,16px) 12px}
h1{font-size:clamp(26px,3.2vw,38px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
h1 .sub{font-weight:500;color:var(--mute);margin-left:.25em}
@media (max-width:600px){h1 .sub{display:block;font-size:17px;margin:4px 0 0}}
.status{margin:6px 0 0;color:var(--mute);font-size:14px}
.search{position:relative;flex:0 1 340px}
.search input{width:100%;height:44px;border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:0 74px 0 14px;font-size:16px}
.search span{position:absolute;right:12px;top:12px;font-size:13px;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:0 max(3vw,16px) 12px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:4px 12px;border:1px solid var(--rule);background:var(--panel);border-radius:18px;font-size:14px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=false]{opacity:.45;background:transparent}
.chip[aria-pressed=false] i{background:transparent;border:1.5px solid var(--c)}
.zoom{position:absolute;z-index:2;top:12px;right:12px;display:flex;gap:6px}
.zoom button{width:44px;height:40px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--rule);background:var(--panel);border-radius:8px;cursor:pointer;font-size:18px;line-height:1}

.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;border-top:1px solid var(--rule);min-height:520px}
@media (min-width:901px){body{height:100vh;display:flex;flex-direction:column}.main{flex:1;min-height:0}}
.mapbox{position:relative;overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
#vp{transform-origin:0 0}
.sc{transform:scale(var(--inv,1));transform-origin:0 0;transform-box:view-box}
.rel,.spoke,.hubspoke{vector-effect:non-scaling-stroke}
.node:focus,.wl:focus,.hub:focus{outline:none}
.node:focus-visible .dot{stroke:var(--brick);stroke-width:4}
.wl:focus-visible rect,.hub:focus-visible circle{stroke:var(--brick);stroke-width:3}
#vp.anim{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){#vp.anim{transition:none}}
.panel{background:var(--panel);border-left:1px solid var(--rule);overflow-y:auto;padding:20px 22px 40px}

/* svg */
.spoke{stroke:var(--spoke);stroke-width:1.2}
.hubspoke{stroke:var(--line);stroke-width:2}
.rel{fill:none;stroke:var(--line);stroke-width:1.4}
.rel.ref{stroke-dasharray:5 4}
.rel.action{stroke:var(--brick);stroke-dasharray:1.5 3.5;stroke-linecap:round;stroke-width:2}
.rel.discovered{stroke:var(--brick);stroke-dasharray:7 4;opacity:.75}
.rel.missing{stroke:var(--brick);stroke-width:2}
.node{cursor:pointer}
.node .dot{stroke:var(--panel);stroke-width:2.5}
.node.p2 .dot{fill:var(--panel);stroke:var(--c);stroke-width:2.2;stroke-dasharray:3 2.5}
.node text{font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.node .flag{fill:var(--brick);stroke:var(--panel);stroke-width:1.5}
.node .ring{fill:none;stroke:var(--brick);stroke-width:1.6}
.wl rect{stroke:var(--panel);stroke-width:2}
.wl text{font-size:12px;font-weight:700;fill:#fff;stroke:none}
.hub circle{fill:var(--ink)}
.hub text{fill:var(--bg);font-size:13px;font-weight:700;stroke:none}
.elabel{font-size:11.5px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.hid{display:none}
svg.focus .node:not(.on),svg.focus .wl:not(.on),svg.focus .hub:not(.on){opacity:.16}
svg.focus .rel:not(.on),svg.focus .spoke:not(.on),svg.focus .hubspoke:not(.on){opacity:.06}
svg.focus .rel.on{stroke-width:2.4;opacity:1}
svg.focus .node.sel text{font-weight:700}
svg.search:not(.focus) .node:not(.hit){opacity:.18}
svg.search:not(.focus) .rel,svg.search:not(.focus) .spoke{opacity:.08}
.node.sel .dot{stroke:var(--ink);stroke-width:3}

/* hover card */
.tip{position:absolute;z-index:3;width:min(340px,calc(100% - 24px));background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.16);pointer-events:none;font-size:14px;line-height:1.45;display:none}
.tip.show{display:block}
.tip.dock{left:12px!important;right:12px;bottom:12px;top:auto!important;width:auto;pointer-events:auto}
.tip h3{margin:2px 0 6px;font-size:18px;line-height:1.2}
.tip p{margin:6px 0}
.tip .more{color:var(--mute);font-size:13px;margin-top:8px}
.tip .more button{border:0;background:none;padding:0;text-decoration:underline;cursor:pointer;color:var(--ink);font-size:14px;min-height:32px}
.wlname{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mute)}
.wlname i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.b{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--rule);white-space:nowrap}
.b.v1{border-color:var(--ink)}
.b.beta{border-color:var(--brick);color:var(--brick)}
.b.miss{background:var(--brick);border-color:var(--brick);color:#fff}
.b.p2{border-style:dashed}

/* panel */
.panel h2{font-size:26px;line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.panel h4{font-size:13px;font-weight:700;margin:22px 0 6px;padding-top:12px;border-top:1px solid var(--rule)}
.panel p{margin:6px 0}
.panel ul{margin:4px 0;padding-left:18px}
.panel li{margin:4px 0}
.panel .lead{font-size:16px}
.back{border:0;background:none;padding:0;min-height:36px;cursor:pointer;color:var(--mute);font-size:14px}
.perm{width:100%;border-collapse:collapse;font-size:14px}
.perm th{text-align:left;font-weight:500;color:var(--mute);width:96px;vertical-align:top;padding:6px 8px 6px 0}
.perm td{padding:6px 0;border-bottom:1px solid var(--rule)}
.ep{background:var(--soft);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:start;justify-content:space-between}
.copy{border:1px solid var(--rule);background:var(--panel);border-radius:6px;font-size:13px;padding:4px 10px;min-height:32px;cursor:pointer;flex:none}
.links{list-style:none;padding:0!important}
.links li{margin:0}
.lk{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:9px 0;min-height:44px;cursor:pointer;font-size:14px}
.lk i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.lk small{color:var(--mute);margin-left:auto;text-align:right}
.legend{display:grid;grid-template-columns:28px 1fr;gap:8px 10px;align-items:center;font-size:14px}
.legend svg{width:28px;height:20px}
.warn{color:var(--brick)}
details summary{cursor:pointer;min-height:32px;font-size:14px}
.props{font-size:13px;color:var(--mute);columns:2;column-gap:14px;margin:6px 0 0}
.changes li{font-size:14px}
.changes time{color:var(--mute);font-size:13px;margin-right:6px;white-space:nowrap}
.foot{margin-top:24px;font-size:13px;color:var(--mute)}
.empty{padding:40px;color:var(--mute)}

@media (max-width:900px){
 .main{grid-template-columns:1fr;height:auto}
 .mapbox{height:72vh;min-height:440px}
 .panel{border-left:0;border-top:1px solid var(--rule)}
}
@media (max-width:600px){.top{padding-top:14px}.search{flex-basis:100%}.bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}.bar::-webkit-scrollbar{display:none}.chip{font-size:13px;padding:4px 10px;flex:none;white-space:nowrap}}
</style>
</head>
<body>
<header class="top">
 <div>
  <h1>M365 Graph Cartographer <span class="sub">MGC</span></h1>
  <p class="status" id="status">Loading…</p>
 </div>
 <label class="search"><input id="q" type="search" placeholder="Search resources or permissions" aria-label="Search the map" autocomplete="off"><span id="qn"></span></label>
</header>
<nav class="bar" id="bar" aria-label="Filters"></nav>
<div class="main">
 <div class="mapbox" id="mapbox">
  <div class="zoom" id="zoom"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button><button data-z="fit" aria-label="Fit to screen">⤢</button></div>
  <svg id="map" role="img" aria-label="M365 Graph Cartographer radial map of Microsoft Graph workloads and resources"><g id="vp"></g></svg>
  <div class="tip" id="tip" role="status"></div>
 </div>
 <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<script>
{
const D = /*__GRAPH_DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = s => { try { return new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); } catch(e){ return s; } };
const NS = 'http://www.w3.org/2000/svg';

if (!D) {
  $('#status').textContent = 'No data embedded.';
  $('#panel').innerHTML = '<p class="empty">Build the page with scanner/build_page.py to embed graph-map.json.</p>';
} else {
  init();
}

function init(){
  const svg = $('#map'), vp = $('#vp'), tip = $('#tip'), panel = $('#panel'), box = $('#mapbox');
  const WL = {}; D.workloads.forEach(w => WL[w.id] = w);
  const hub = {...D.hub, kind:'hub'};
  const nodes = D.nodes.map(n => ({...n, kind: n.kind || 'entity'}));
  const by = {[hub.id]: hub};
  nodes.forEach(n => by[n.id] = n);
  D.workloads.forEach(w => by['wl:'+w.id] = {...w, kind:'workload', id:'wl:'+w.id, wid:w.id});
  // Parallel discovered links (same pair, e.g. createdByUser + lastModifiedByUser) draw as one chord.
  const edges = [], discPair = {};
  D.edges.filter(e => by[e.s] && by[e.t]).forEach(e => {
    if (e.kind !== 'discovered') { edges.push(e); return; }
    const k = e.s + '>' + e.t, m = discPair[k];
    if (!m) { edges.push(discPair[k] = {...e}); return; }
    m.nav += ', ' + e.nav;
    if (e.scan === 'v1.0') m.scan = 'v1.0';
  });
  nodes.forEach(n => n.deg = 0);
  edges.forEach(e => { by[e.s].deg++; by[e.t].deg++; });
  const recent = D.recentChanges || [];
  const changed = new Set(recent.filter(c => c.node && (Date.now() - new Date(c.date)) < 45*864e5 && c.kind !== 'baseline' && c.kind !== 'retargeted').map(c => c.node));
  const scanInfo = D.meta && D.meta.scan;

  /* ---------- layout: hub at 0,0; workloads on R1; resources on R2 ---------- */
  const R1 = 205, R2 = 360, GAP = 1.1;
  const groups = D.workloads.map(w => ({w, items: nodes.filter(n => n.workload === w.id)}));
  const slots = groups.reduce((a, g) => a + g.items.length + GAP, 0);
  const step = 2*Math.PI / slots;
  let a = -Math.PI/2 - (groups[0].items.length * step)/2;
  groups.forEach(g => {
    const start = a;
    g.items.forEach(n => { n.ang = a + step/2; n.x = Math.cos(n.ang)*R2; n.y = Math.sin(n.ang)*R2; a += step; });
    const wl = by['wl:'+g.w.id];
    wl.ang = (start + a)/2; wl.x = Math.cos(wl.ang)*R1; wl.y = Math.sin(wl.ang)*R1;
    a += step*GAP;
  });
  hub.x = 0; hub.y = 0;
  const radius = n => n.kind === 'gap' ? 7 : 5 + Math.min(n.deg, 12)*0.55;

  /* ---------- draw ---------- */
  const curve = (s, t) => {
    const cx = (s.x + t.x)/2 * 0.32, cy = (s.y + t.y)/2 * 0.32;
    return `M${s.x.toFixed(1)} ${s.y.toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${t.x.toFixed(1)} ${t.y.toFixed(1)}`;
  };
  const relClass = e => ['rel', e.kind, (e.scan === 'not found') ? 'missing' : ''].join(' ');
  const shape = n => {
    const r = radius(n), c = WL[n.workload].colour;
    if (n.kind === 'gap') return `<rect class="dot" x="${-r}" y="${-r}" width="${2*r}" height="${2*r}" transform="rotate(45)" fill="${c}"/>`;
    if (n.kind === 'operation') return `<rect class="dot" x="${-r}" y="${-r}" width="${2*r}" height="${2*r}" rx="3" fill="${c}"/>`;
    return `<circle class="dot" r="${r}" fill="${c}"/>`;
  };
  const label = n => {
    const deg = n.ang*180/Math.PI, flip = Math.cos(n.ang) < 0, off = radius(n) + 7;
    return flip
      ? `<text transform="rotate(${(deg+180).toFixed(1)})" x="${-off}" dy=".35em" text-anchor="end">${esc(n.label)}</text>`
      : `<text transform="rotate(${deg.toFixed(1)})" x="${off}" dy=".35em">${esc(n.label)}</text>`;
  };
  const marks = n => {
    const st = n.scan && n.scan.status, r = radius(n);
    let s = '';
    if (st === 'beta only') s += `<circle class="ring" r="${r+4}"/>`;
    if (st === 'not found') s += `<circle class="ring" r="${r+4}" stroke-dasharray="2 2"/>`;
    if (changed.has(n.id)) s += `<circle class="flag" cx="${(r*.75).toFixed(1)}" cy="${(-r*.75).toFixed(1)}" r="4"/>`;
    return s;
  };

  let html = '';
  D.workloads.forEach(w => { const wl = by['wl:'+w.id]; html += `<line class="hubspoke" data-a="${hub.id}" data-b="${wl.id}" x1="0" y1="0" x2="${wl.x}" y2="${wl.y}"/>`; });
  nodes.forEach(n => { const wl = by['wl:'+n.workload]; html += `<line class="spoke" data-a="${wl.id}" data-b="${n.id}" data-w="${n.workload}" x1="${wl.x}" y1="${wl.y}" x2="${n.x}" y2="${n.y}"/>`; });
  edges.forEach((e, i) => { html += `<path class="${relClass(e)}" data-i="${i}" data-a="${e.s}" data-b="${e.t}" d="${curve(by[e.s], by[e.t])}"/>`; });
  html += `<g class="hub" data-id="${hub.id}" tabindex="0" role="button" aria-label="${esc(hub.label)}"><g class="sc"><circle r="34"/><text text-anchor="middle" y="-3">Microsoft</text><text text-anchor="middle" y="12">Graph</text></g></g>`;
  D.workloads.forEach(w => {
    const wl = by['wl:'+w.id], nm = w.short || w.label, tw = nm.length*7.2 + 18;
    html += `<g class="wl${w.phase===2?' p2w':''}" data-id="${wl.id}" data-w="${w.id}" transform="translate(${wl.x.toFixed(1)} ${wl.y.toFixed(1)})" tabindex="0" role="button" aria-label="${esc(w.label)}"><g class="sc"><rect x="${-tw/2}" y="-12" width="${tw}" height="24" rx="12" fill="${w.colour}"/><text text-anchor="middle" dy=".35em">${esc(nm)}</text></g></g>`;
  });
  nodes.forEach(n => {
    html += `<g class="node${n.phase===2?' p2':''}" style="--c:${WL[n.workload].colour}" data-id="${n.id}" data-w="${n.workload}" transform="translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})" tabindex="0" role="button" aria-label="${esc(n.label)}"><g class="sc">${shape(n)}${marks(n)}${label(n)}</g></g>`;
  });
  html += '<g id="elabels"></g>';
  vp.innerHTML = html;
  const elabels = $('#elabels');

  /* ---------- status line ---------- */
  const relCount = edges.filter(e => e.kind !== 'discovered').length;  // curated links only; discovered ones are off by default
  $('#status').textContent = `${nodes.length} resources · ${D.workloads.length} workloads · ${relCount} links · ` +
    (scanInfo ? `schema scanned ${fmtDate(scanInfo.at)}` : 'schema scan not yet run (curated notes only)');

  /* ---------- filters ---------- */
  const hiddenW = new Set(); let showP2 = true, showDisc = false;  // discovered links are review material: off until the chip is pressed
  const bar = $('#bar');
  bar.innerHTML = D.workloads.map(w => `<button class="chip" style="--c:${w.colour}" data-w="${w.id}" aria-pressed="true"><i></i>${esc(w.label)}</button>`).join('') +
    `<button class="chip" style="--c:var(--mute)" data-t="p2" aria-pressed="true"><i></i>Phase 2</button>` +
    (edges.some(e => e.kind === 'discovered') ? `<button class="chip" style="--c:var(--brick)" data-t="disc" aria-pressed="false"><i></i>Discovered links</button>` : '');
  $('#zoom').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; b.dataset.z === 'fit' ? fit(true) : zoomBy(b.dataset.z === 'in' ? 1.35 : 1/1.35); });
  bar.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    if (b.dataset.w) on ? hiddenW.delete(b.dataset.w) : hiddenW.add(b.dataset.w);
    if (b.dataset.t === 'p2') showP2 = on;
    if (b.dataset.t === 'disc') showDisc = on;
    applyFilters();
  });
  const visible = id => {
    const n = by[id]; if (!n) return false;
    if (n.kind === 'hub') return true;
    const w = n.kind === 'workload' ? n.wid : n.workload;
    if (hiddenW.has(w)) return false;
    if (!showP2 && (n.phase === 2 || WL[w].phase === 2)) return false;
    return true;
  };
  function applyFilters(){
    vp.querySelectorAll('[data-id]').forEach(el => el.classList.toggle('hid', !visible(el.dataset.id)));
    vp.querySelectorAll('[data-a]').forEach(el => {
      const e = el.dataset.i != null ? edges[+el.dataset.i] : null;
      el.classList.toggle('hid', !visible(el.dataset.a) || !visible(el.dataset.b) || (e && e.kind === 'discovered' && !showDisc));
    });
    if (sel && !visible(sel)) select(null); else highlight(sel);
  }

  /* ---------- viewport: pan and zoom ---------- */
  const view = {k:1, tx:0, ty:0};
  const apply = (anim) => {
    vp.classList.toggle('anim', !!anim);
    vp.style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.k})`;
    vp.style.setProperty('--inv', (1/view.k).toFixed(4));
  };
  function fit(anim){
    const w = box.clientWidth, h = box.clientHeight, m = Math.min(w, h)/2;
    const room = w < 600 ? 34 : Math.min(175, m*0.48);
    view.k = Math.max(.2, (m - room) / (R2 + 12)); view.tx = w/2; view.ty = h/2; apply(anim); touched = false;
  }
  function zoomBy(f, px, py){
    const w = box.clientWidth, h = box.clientHeight;
    px = px ?? w/2; py = py ?? h/2;
    const k = Math.max(.2, Math.min(5, view.k*f));
    view.tx = px - (px - view.tx)*(k/view.k); view.ty = py - (py - view.ty)*(k/view.k); view.k = k; touched = true; apply(px === w/2);
  }
  function centreOn(n){
    const w = box.clientWidth, h = box.clientHeight;
    view.k = Math.max(view.k, Math.min(w, h)/(2*R2)*1.05);
    view.tx = w/2 - n.x*view.k; view.ty = h/2 - n.y*view.k; touched = true; apply(true);
  }
  let lw = 0, lh = 0, touched = false;
  new ResizeObserver(() => {
    const w = box.clientWidth, h = box.clientHeight;
    if (!touched || !lw) fit(false); else { view.tx += (w - lw)/2; view.ty += (h - lh)/2; apply(false); }
    lw = w; lh = h;
  }).observe(box);

  const ptrs = new Map(); let downAt = null, moved = false, pinch = null, downTarget = null;
  svg.addEventListener('pointerdown', e => {
    svg.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (ptrs.size === 1) { downAt = {x:e.clientX, y:e.clientY, tx:view.tx, ty:view.ty}; moved = false; downTarget = e.target.closest('[data-id]'); }
    if (ptrs.size === 2) { const [p, q] = [...ptrs.values()]; pinch = {d: Math.hypot(p.x-q.x, p.y-q.y), k: view.k}; moved = true; }
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (ptrs.size === 2 && pinch) {
      const [p, q] = [...ptrs.values()], r = box.getBoundingClientRect();
      const d = Math.hypot(p.x-q.x, p.y-q.y);
      zoomBy((pinch.k * d/pinch.d)/view.k, (p.x+q.x)/2 - r.left, (p.y+q.y)/2 - r.top);
      return;
    }
    if (!downAt) return;
    const dx = e.clientX - downAt.x, dy = e.clientY - downAt.y;
    if (!moved && Math.hypot(dx, dy) > 5) { moved = true; svg.classList.add('drag'); hideTip(); }
    if (moved) { view.tx = downAt.tx + dx; view.ty = downAt.ty + dy; touched = true; apply(false); }
  });
  const up = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size) return;
    svg.classList.remove('drag');
    if (!moved && downAt) {
      if (downTarget) { select(downTarget.dataset.id); if (e.pointerType !== 'mouse') dockTip(downTarget.dataset.id); }
      else { select(null); hideTip(); }
    }
    downAt = null;
  };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = box.getBoundingClientRect();
    zoomBy(Math.exp(-e.deltaY*0.0015), e.clientX - r.left, e.clientY - r.top);
  }, {passive:false});

  /* ---------- highlight ---------- */
  function neighbourhood(id){
    const n = by[id], on = new Set([id]), lines = new Set();
    if (n.kind === 'hub') D.workloads.forEach(w => on.add('wl:'+w.id));
    else if (n.kind === 'workload') { on.add(hub.id); nodes.filter(x => x.workload === n.wid).forEach(x => on.add(x.id)); }
    else {
      on.add('wl:'+n.workload);
      edges.forEach(e => { if (e.kind === 'discovered' && !showDisc) return; if (e.s === id) on.add(e.t); if (e.t === id) on.add(e.s); });
    }
    return on;
  }
  function highlight(id){
    elabels.innerHTML = '';
    vp.querySelectorAll('.on,.sel').forEach(el => el.classList.remove('on','sel'));
    if (!id) { svg.classList.remove('focus'); return; }
    svg.classList.add('focus');
    const on = neighbourhood(id);
    vp.querySelectorAll('[data-id]').forEach(el => { if (on.has(el.dataset.id)) el.classList.add('on'); });
    vp.querySelector(`[data-id="${CSS.escape(id)}"]`)?.classList.add('sel');
    let lab = '';
    const placed = [];
    vp.querySelectorAll('[data-a]').forEach(el => {
      const a = el.dataset.a, b = el.dataset.b;
      if ((a === id && on.has(b)) || (b === id && on.has(a))) {
        el.classList.add('on');
        if (el.dataset.i != null && !el.classList.contains('hid')) {
          const e = edges[+el.dataset.i], s = by[e.s], t = by[e.t];
          if (by[id].kind === 'workload' || by[id].kind === 'hub') return;
          const far = e.s === id ? t : s, near = far === t ? s : t, txt = e.via || e.nav || e.action || e.label || '';
          const cx = (s.x+t.x)/2*0.32, cy = (s.y+t.y)/2*0.32, k = view.k;
          const lw = (txt.length*6.3 + 10)/k, lh = 16/k;
          for (const u of [0.78, 0.62, 0.9, 0.48, 0.35]) {
            const mx = (1-u)**2*near.x + 2*(1-u)*u*cx + u*u*far.x, my = (1-u)**2*near.y + 2*(1-u)*u*cy + u*u*far.y;
            if (placed.some(p => Math.abs(p.x - mx) < (p.w + lw)/2 && Math.abs(p.y - my) < (p.h + lh)/2)) continue;
            placed.push({x: mx, y: my, w: lw, h: lh});
            lab += `<g transform="translate(${mx.toFixed(1)} ${my.toFixed(1)})"><g class="sc"><text class="elabel" text-anchor="middle" dy=".35em">${esc(txt)}</text></g></g>`;
            break;
          }
        }
      }
    });
    elabels.innerHTML = lab;
  }

  /* ---------- hover card ---------- */
  const statusBadge = n => {
    if (n.kind === 'gap') return '<span class="b">Outside Graph</span>';
    if (!n.scan) return (n.entityType || n.action) ? '<span class="b">Not scanned yet</span>' : '';
    const s = n.scan.status;
    return `<span class="b ${s === 'v1.0' ? 'v1' : s === 'beta only' ? 'beta' : 'miss'}">${s === 'not found' ? 'Not found in $metadata' : s}</span>`;
  };
  const badges = n => `<div class="badges">${statusBadge(n)}${n.phase === 2 ? '<span class="b p2">Phase 2</span>' : ''}${n.kind === 'operation' ? '<span class="b">Action</span>' : ''}${changed.has(n.id) ? '<span class="b beta">Changed recently</span>' : ''}</div>`;
  const wlName = w => `<div class="wlname" style="--c:${w.colour}"><i></i>${esc(w.label)}</div>`;
  function tipHtml(id, docked){
    const n = by[id];
    let h = '';
    if (n.kind === 'hub') h = `<h3>${esc(n.label)}</h3><p>${esc(n.summary)}</p><p><code>${esc(n.path)}</code></p>`;
    else if (n.kind === 'workload') {
      const c = nodes.filter(x => x.workload === n.wid).length;
      h = `${wlName(n)}<h3>${esc(n.label)}</h3><p>${esc(n.summary)}</p><p>${c} resources on the map.</p>`;
    } else {
      const p = n.permissions || {};
      h = `${wlName(WL[n.workload])}<h3>${esc(n.label)}</h3>${badges(n)}<p><code>${esc(n.path)}</code></p>` +
        (p.delegated ? `<p><b>Delegated:</b> ${esc(p.delegated)}<br><b>Application:</b> ${esc(p.application)}</p>` : `<p>${esc(n.summary)}</p>`) +
        (n.limits && n.limits[0] ? `<p><b>Watch for:</b> ${esc(n.limits[0])}</p>` : '');
    }
    h += docked ? `<p class="more"><button data-full>Full notes ↓</button> · <button data-close>Close</button></p>` : `<p class="more">Click for full notes</p>`;
    return h;
  }
  function showTip(id, ev){
    tip.className = 'tip show'; tip.innerHTML = tipHtml(id, false);
    const r = box.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = ev.clientX - r.left + 18, y = ev.clientY - r.top + 18;
    if (x + tw > r.width - 8) x = ev.clientX - r.left - tw - 18;
    if (y + th > r.height - 8) y = Math.max(8, r.height - th - 8);
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = y + 'px';
  }
  function dockTip(id){ tip.className = 'tip show dock'; tip.innerHTML = tipHtml(id, true); }
  function hideTip(){ tip.className = 'tip'; }
  tip.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) hideTip();
    if (e.target.closest('[data-full]')) { hideTip(); panel.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'}); }
  });
  svg.addEventListener('pointerover', e => {
    if (e.pointerType !== 'mouse' || downAt) return;
    const g = e.target.closest('[data-id]'); if (!g) return;
    highlight(g.dataset.id); showTip(g.dataset.id, e);
  });
  svg.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || downAt || !tip.classList.contains('show') || tip.classList.contains('dock')) return;
    const g = e.target.closest('[data-id]'); if (g) showTip(g.dataset.id, e);
  });
  svg.addEventListener('pointerout', e => {
    if (e.pointerType !== 'mouse') return;
    const g = e.target.closest('[data-id]'); if (!g || g.contains(e.relatedTarget)) return;
    hideTip(); highlight(sel);
  });
  svg.addEventListener('keydown', e => {
    const g = e.target.closest('[data-id]');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(g.dataset.id); }
    if (e.key === 'Escape') { select(null); hideTip(); }
  });
  svg.addEventListener('focusin', e => { const g = e.target.closest('[data-id]'); if (g) highlight(g.dataset.id); });

  /* ---------- panel ---------- */
  let sel = null;
  const ul = items => items && items.length ? `<ul>${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p>None recorded yet.</p>';
  const kindWord = {nav:'relationship', ref:'reference by ID', action:'action', discovered:'found by scanner'};
  function connections(id){
    const rows = edges.filter(e => e.s === id || e.t === id).map(e => {
      const out = e.s === id, other = by[out ? e.t : e.s];
      const via = e.via || e.nav || e.action || e.label || '';
      const st = e.scan && !['v1.0','n/a','not scanned'].includes(e.scan) ? ` · ${e.scan}` : '';
      return `<li><button class="lk" data-go="${other.id}" style="--c:${WL[other.workload].colour}"><i></i>${out ? '→' : '←'} ${esc(other.label)}<small>${esc(via)} · ${kindWord[e.kind] || e.kind}${esc(st)}</small></button></li>`;
    });
    return rows.length ? `<ul class="links">${rows.join('')}</ul>` : '<p>No links recorded.</p>';
  }
  const pl = (k, one, many) => `${k} ${k === 1 ? one : (many || one + 's')}`;
  function schemaBlock(n){
    if (!n.scan) return (n.entityType || n.action) ? `<p>Not scanned yet. The scanner checks <code>${esc(n.entityType || n.action)}</code> against v1.0 and beta $metadata.</p>` : '';
    const s = n.scan;
    if (!s.props) return `<p>Action <code>${esc(n.action)}</code>: ${esc(s.status)}.</p>`;
    const navs = Object.entries(s.navs || {}), inV1 = s.status === 'v1.0', bw = inV1 ? 'Beta-only' : 'Beta';
    const counts = inV1
      ? `${pl(s.props.length,'property','properties')} and ${pl(navs.length,'relationship')} in v1.0.${s.betaOnlyProps.length || s.betaOnlyNavs.length ? ` Beta adds ${pl(s.betaOnlyProps.length,'property','properties')} and ${pl(s.betaOnlyNavs.length,'relationship')}.` : ''}`
      : s.status === 'beta only'
        ? `Not in v1.0. Beta has ${pl(s.betaOnlyProps.length,'property','properties')} and ${pl(s.betaOnlyNavs.length,'relationship')}.`
        : 'Not found in v1.0 or beta $metadata. Check the entity type name.';
    return `<p><code>${esc(n.entityType)}</code>${s.baseTypes && s.baseTypes.length ? ` inherits from ${s.baseTypes.map(esc).join(' → ')}` : ''}.</p>
      <p>${counts}</p>
      ${navs.length ? `<details><summary>Relationships (${navs.length})</summary><p class="props">${navs.map(([k, v]) => `${esc(k)} → ${esc(v.replace('microsoft.graph.', ''))}`).join('<br>')}</p></details>` : ''}
      ${s.props.length ? `<details><summary>Properties (${s.props.length})</summary><p class="props">${s.props.map(esc).join('<br>')}</p></details>` : ''}
      ${s.betaOnlyProps.length ? `<details><summary>${bw} properties (${s.betaOnlyProps.length})</summary><p class="props">${s.betaOnlyProps.map(esc).join('<br>')}</p></details>` : ''}
      ${s.betaOnlyNavs.length ? `<details><summary>${bw} relationships (${s.betaOnlyNavs.length})</summary><p class="props">${s.betaOnlyNavs.map(esc).join('<br>')}</p></details>` : ''}`;
  }
  function changesFor(id){
    const list = recent.filter(c => id ? c.node === id : true).slice(0, id ? 10 : 12);
    if (!list.length) return id ? '' : '<p>No changes recorded yet. The first scheduled scan sets the baseline; later scans list what moved.</p>';
    return `${id ? '<h4>Recent changes</h4>' : ''}<ul class="changes">${list.map(c => `<li><time>${fmtDate(c.date)}</time>${esc(c.text)}</li>`).join('')}</ul>`;
  }
  const back = '<button class="back" data-go="">← Overview</button>';
  const docsLink = u => u ? `<p><a href="${esc(u)}" target="_blank" rel="noopener">Microsoft Learn reference ↗</a></p>` : '';
  const legendRow = (svgInner, text) => `<svg viewBox="0 0 28 20" aria-hidden="true">${svgInner}</svg><span>${text}</span>`;

  function renderOverview(){
    panel.innerHTML = `<h2>How to read the map</h2>
      <p class="lead">Microsoft Graph sits at the centre. Each coloured station is a workload; the dots round the edge are the resources you call. Lines across the circle show how one resource leads to another. Hover over anything for a quick summary, and click it for the full notes.</p>
      <h4>Key</h4>
      <div class="legend">
        ${legendRow('<circle cx="14" cy="10" r="7" fill="var(--mute)"/>', 'Resource (bigger means more links)')}
        ${legendRow('<rect x="8" y="4" width="12" height="12" rx="2" fill="var(--mute)"/>', 'Action, such as running a hunting query')}
        ${legendRow('<rect x="9" y="5" width="10" height="10" transform="rotate(45 14 10)" fill="var(--mute)"/>', 'Not in Graph: needs PowerShell or another API')}
        ${legendRow('<circle cx="14" cy="10" r="7" fill="none" stroke="var(--mute)" stroke-width="2" stroke-dasharray="3 2.5"/>', 'Phase 2: stubbed, deeper notes to come')}
        ${legendRow('<path d="M2 14Q14 2 26 14" fill="none" stroke="var(--line)" stroke-width="1.6"/>', 'Relationship (navigation property)')}
        ${legendRow('<path d="M2 14Q14 2 26 14" fill="none" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="5 4"/>', 'Reference by ID, not a direct path')}
        ${legendRow('<path d="M2 14Q14 2 26 14" fill="none" stroke="var(--brick)" stroke-width="2" stroke-dasharray="1.5 3.5" stroke-linecap="round"/>', 'Action on the resource')}
        ${legendRow('<path d="M2 14Q14 2 26 14" fill="none" stroke="var(--brick)" stroke-width="1.6" stroke-dasharray="7 4"/>', 'Link found by the scanner, not yet curated')}
        ${legendRow('<circle cx="14" cy="10" r="5" fill="var(--mute)"/><circle cx="14" cy="10" r="9" fill="none" stroke="var(--brick)" stroke-width="1.6"/>', 'Beta only in Graph')}
        ${legendRow('<circle cx="14" cy="10" r="6" fill="var(--mute)"/><circle cx="19" cy="5" r="4" fill="var(--brick)"/>', 'Changed in a recent scan')}
      </div>
      <h4>Workloads</h4>
      <ul class="links">${D.workloads.map(w => `<li><button class="lk" data-go="wl:${w.id}" style="--c:${w.colour}"><i></i>${esc(w.label)}<small>${nodes.filter(n => n.workload === w.id).length} resources${w.phase === 2 ? ' · phase 2' : ''}</small></button></li>`).join('')}</ul>
      <h4>Recent changes</h4>${changesFor(null)}
      <p class="foot">Curated notes v${esc(D.meta.curatedVersion)}, ${fmtDate(D.meta.curatedOn)}. ${scanInfo ? `Schema scanned ${fmtDate(scanInfo.at)}: ${scanInfo.v1EntityTypes} entity types in v1.0, ${scanInfo.betaEntityTypes} in beta${scanInfo.permissionsChecked ? `, ${scanInfo.permissionCount} permissions checked` : ''}.` : 'The schema scan has not run yet, so version badges and property lists will appear after the first scan.'} ${esc(D.meta.phase || '')}</p>`;
  }
  function renderHub(){
    panel.innerHTML = `${back}<h2>${esc(hub.label)}</h2><p class="lead">${esc(hub.summary)}</p>
      <div class="ep"><code>${esc(hub.path)}</code></div>
      <h4>Two ways to call it</h4><table class="perm"><tr><th>Delegated</th><td>${esc(hub.permissions.delegated)}</td></tr><tr><th>Application</th><td>${esc(hub.permissions.application)}</td></tr></table>
      <h4>Limits that apply everywhere</h4>${ul(hub.limits)}<h4>How to map it</h4>${ul(hub.mapping)}${docsLink(hub.docs)}`;
  }
  function renderWorkload(n){
    const items = nodes.filter(x => x.workload === n.wid);
    panel.innerHTML = `${back}${wlName(n)}<h2>${esc(n.label)}</h2>${n.phase === 2 ? '<div class="badges"><span class="b p2">Phase 2</span></div>' : ''}<p class="lead">${esc(n.summary)}</p>
      <h4>Workload-wide limits</h4>${ul(n.limits)}
      <h4>Resources</h4><ul class="links">${items.map(x => `<li><button class="lk" data-go="${x.id}" style="--c:${n.colour}"><i></i>${esc(x.label)}<small>${esc(x.scan ? x.scan.status : (x.kind === 'gap' ? 'outside Graph' : ''))}</small></button></li>`).join('')}</ul>${docsLink(n.docs)}`;
  }
  function renderNode(n){
    const p = n.permissions, pc = n.permCheck;
    panel.innerHTML = `${back}${wlName(WL[n.workload])}<h2>${esc(n.label)}</h2>${badges(n)}<p class="lead">${esc(n.summary)}</p>
      <div class="ep"><code>${esc(n.path)}</code><button class="copy" data-copy="${esc(n.path)}">Copy</button></div>
      ${p ? `<h4>Permissions (least privileged first)</h4><table class="perm"><tr><th>Delegated</th><td>${esc(p.delegated)}</td></tr><tr><th>Application</th><td>${esc(p.application)}</td></tr></table>
        ${pc && pc.unknown.length ? `<p class="warn">Not found in the current permission list: ${pc.unknown.map(esc).join(', ')}. Check whether it has been renamed.</p>` : ''}` : ''}
      ${n.licence ? `<h4>Licensing</h4><p>${esc(n.licence)}</p>` : ''}
      <h4>${n.kind === 'gap' ? 'Not covered by Graph' : 'Limitations'}</h4>${ul(n.limits)}
      <h4>How to map it</h4>${ul(n.mapping)}
      <h4>Connections</h4>${connections(n.id)}
      ${n.entityType || n.action ? `<h4>Schema</h4>${schemaBlock(n)}` : ''}
      ${changesFor(n.id)}
      ${docsLink(n.docs)}
      <p class="foot"><button class="copy" data-copy="#${esc(n.id)}" data-link>Copy link to this resource</button></p>`;
  }
  function select(id, fromHash){
    sel = id && by[id] ? id : null;
    highlight(sel);
    if (!sel) renderOverview();
    else { const n = by[sel]; n.kind === 'hub' ? renderHub() : n.kind === 'workload' ? renderWorkload(n) : renderNode(n); }
    panel.scrollTop = 0;
    if (!fromHash) { try { history.replaceState(null, '', sel && !sel.startsWith('wl:') ? '#' + sel : location.pathname + location.search); } catch(e){} }
  }
  panel.addEventListener('click', async e => {
    const go = e.target.closest('[data-go]');
    if (go) { const id = go.dataset.go || null; if (id && !visible(id)) { hiddenW.clear(); showP2 = true; bar.querySelectorAll('.chip:not([data-t="disc"])').forEach(c => c.setAttribute('aria-pressed', 'true')); applyFilters(); } select(id); if (id) centreOn(by[id]); return; }
    const cp = e.target.closest('[data-copy]');
    if (cp) {
      let text = cp.dataset.copy;
      if (cp.hasAttribute('data-link')) { try { text = location.href.split('#')[0] + text; } catch(err){} }
      try { await navigator.clipboard.writeText(text); cp.textContent = 'Copied'; } catch(err) { cp.textContent = 'Copy blocked: select the text instead'; }
      setTimeout(() => { cp.textContent = cp.hasAttribute('data-link') ? 'Copy link to this resource' : 'Copy'; }, 1800);
    }
  });

  /* ---------- search ---------- */
  const q = $('#q'), qn = $('#qn');
  const hay = n => [n.label, n.path, n.summary, n.entityType, n.permissions && n.permissions.delegated, n.permissions && n.permissions.application, ...(n.limits || []), ...(n.mapping || [])].join(' ').toLowerCase();
  let hits = [];
  q.addEventListener('input', () => {
    const t = q.value.trim().toLowerCase();
    vp.querySelectorAll('.hit').forEach(el => el.classList.remove('hit'));
    if (!t) { svg.classList.remove('search'); qn.textContent = ''; hits = []; return; }
    hits = nodes.filter(n => visible(n.id) && hay(n).includes(t));
    hits.forEach(n => vp.querySelector(`[data-id="${CSS.escape(n.id)}"]`)?.classList.add('hit'));
    svg.classList.add('search');
    if (sel) { sel = null; highlight(null); }
    qn.textContent = hits.length ? `${hits.length} found` : 'none';
  });
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter' && hits[0]) { select(hits[0].id); centreOn(hits[0]); }
    if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); }
  });

  /* ---------- start ---------- */
  const fromHash = () => { const h = decodeURIComponent((location.hash || '').slice(1)); return h && by[h] ? h : null; };
  window.addEventListener('hashchange', () => { const h = fromHash(); if (h !== sel) select(h, true); });
  fit(false);
  applyFilters();
  select(fromHash(), true);
}
}
</script>
</body>
</html>
