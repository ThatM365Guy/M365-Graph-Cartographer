<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGC: M365 Graph Cartographer</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a working reference sheet for Microsoft 365 architects. Precise, calm, nothing decorative.
   IDEA: a surveyor's plan that opens like a fan. Graph at the centre, services on the first ring, sub-services
   on the second, APIs on the third; only one branch is open at a time, and the open branch turns to face the
   free space on the right. The side panel is the title block and notes.
   COLOUR and TYPE: stone ground, black ink, brick accent, white panels; four workload families (identity blues,
   collaboration greens, security and compliance reds, AI purple). Schibsted Grotesk.
   LAYOUT: one header row; the ring fills the left; notes on the right. Desktop only (1280 px and up). */
:root{color-scheme:light;--bg:#e7e4df;--ink:#141210;--mute:#5b554e;--panel:#fff;--soft:#f3f1ed;--rule:#d3cec6;--brick:#c8371e;--line:rgba(20,18,16,.28);--spoke:rgba(20,18,16,.16);--guide:rgba(20,18,16,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#171513;--ink:#ece8e2;--mute:#a49d94;--panel:#211e1b;--soft:#2a2622;--rule:#3b3631;--brick:#ec6a49;--line:rgba(236,232,226,.30);--spoke:rgba(236,232,226,.15);--guide:rgba(236,232,226,.22)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#171513;--ink:#ece8e2;--mute:#a49d94;--panel:#211e1b;--soft:#2a2622;--rule:#3b3631;--brick:#ec6a49;--line:rgba(236,232,226,.30);--spoke:rgba(236,232,226,.15);--guide:rgba(236,232,226,.22)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
code{font:13.5px/1.45 ui-monospace,"Cascadia Mono",Consolas,monospace;overflow-wrap:anywhere}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--brick);outline-offset:2px}

/* desktop only */
.narrow{display:none;padding:48px 24px;max-width:520px;margin:0 auto}
.narrow h1{font-size:26px;line-height:1.15;margin:0 0 10px}
@media (max-width:999px){.app{display:none!important}.narrow{display:block}body{overflow:auto}}

.app{height:100vh;display:flex;flex-direction:column}
/* header: one row */
.top{display:flex;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid var(--rule);background:var(--bg);position:relative;z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;margin-right:auto}
.brand b{font-size:22px;letter-spacing:.02em}
.brand span{color:var(--mute);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 16px;min-height:36px;cursor:pointer;font-size:14px;font-weight:500}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.search{position:relative;width:min(320px,26vw)}
.search input{width:100%;height:38px;border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:0 12px;font-size:14.5px}
.qres{position:absolute;top:calc(100% + 4px);left:0;width:max(100%,380px);background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);list-style:none;margin:0;padding:4px 0;max-height:60vh;overflow-y:auto;z-index:8}
.qres[hidden]{display:none}
.qres li{padding:7px 14px;cursor:pointer;font-size:14px;line-height:1.35}
.qres li[aria-selected=true]{background:var(--soft)}
.qres li small{display:block;color:var(--mute);font-size:12.5px}
.qres li i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}
.qres .none{color:var(--mute);cursor:default}
.tbtn{position:relative;border:1px solid var(--rule);background:var(--panel);border-radius:8px;min-height:38px;padding:4px 14px;cursor:pointer;font-size:14px}
.tbtn[aria-expanded=true]{border-color:var(--ink)}
.tbtn .n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11.5px;margin-left:6px;padding:0 5px}
.tbtn .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--brick)}
.tbtn .dot[hidden],.tbtn .n[hidden]{display:none}
.fpanel{position:absolute;top:calc(100% - 2px);right:96px;width:320px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px 16px 14px;z-index:8;font-size:14px}
.fpanel{max-height:calc(100vh - 80px);overflow-y:auto}
.fpanel[hidden]{display:none}
.fpanel h5{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:12px 0 4px;font-weight:700}
.fpanel label{display:flex;align-items:center;gap:9px;min-height:30px;cursor:pointer}
.fpanel label small{color:var(--mute);margin-left:auto;font-size:12.5px}
.fpanel input{accent-color:var(--ink);width:16px;height:16px;margin:0}
.fpanel .sw i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px}
.mapbox{position:relative;overflow:hidden;touch-action:none}
.crumbs{position:absolute;z-index:2;top:12px;left:16px;right:16px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font-size:14px;pointer-events:none}
.crumbs button{pointer-events:auto;border:0;background:none;padding:2px 4px;cursor:pointer;border-radius:4px;color:var(--mute)}
.crumbs button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.crumbs button:last-child{color:var(--ink);font-weight:700}
.crumbs .sep{color:var(--mute)}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.panel{background:var(--panel);border-left:1px solid var(--rule);overflow-y:auto;padding:18px 22px 40px}

/* ring */
.guide{fill:none;stroke:var(--guide);stroke-width:1;stroke-dasharray:3 5}
.spk{stroke:var(--spoke);stroke-width:1.2;fill:none}
.it{cursor:pointer;outline:none}
.it.off{pointer-events:none}
.it .bub{stroke:var(--panel);stroke-width:2}
.it .fr{fill:none;stroke:var(--brick);stroke-width:2.5;opacity:0}
.it:focus-visible .fr{opacity:1}
.it text{pointer-events:none}
.it .lab{font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.it.sub .lab,.it.api .lab{font-size:12.5px}
.it.svc .lab{font-weight:700}
.it.svc.small .lab{font-size:11.5px;font-weight:500}
.it .cnt{fill:#fff;font-size:12px;font-weight:700}
.it.svc .cnt{font-size:13px}
.it.svc.small .cnt{font-size:10.5px}
.it .in{fill:#fff;font-size:11px;font-weight:700}
.it.svc.open .cnt{font-size:11px;font-weight:500}
.it.sat circle,.sat circle{stroke:none}
.it.hub .bub{fill:var(--ink);stroke:none}
.it.hub text{fill:var(--bg);font-size:12.5px;font-weight:700}
.it.api.sel .bub{stroke:var(--ink);stroke-width:3}
.it.api.sel .lab{font-weight:700}
.it.sub.open .bub,.it.svc.open .bub{stroke:var(--ink);stroke-width:2.5}
.it .mk{fill:none;stroke-width:1.6}
.it .mk.beta{stroke:var(--brick)}
.it .mk.miss{stroke:var(--brick);stroke-dasharray:2 2}
.it .mk.legacy{stroke:var(--mute);stroke-dasharray:3 2}
.it .flag{fill:var(--brick);stroke:var(--panel);stroke-width:1.5}
.it.pill .bub{stroke:var(--panel)}
.it.pill .lab{fill:#fff;stroke:none;font-weight:700;font-size:11.5px}
.it.dotsub .bub{stroke:none}
/* a service or sub-service with nothing mapped yet: hollow, dashed */
.it.empty .bub{fill:var(--panel);stroke:var(--c);stroke-width:1.6;stroke-dasharray:3 2}
.it.empty .cnt{display:none}
/* "+n more": the APIs a crowded sub-service doesn't show on the ring */
.it.mor .bub{fill:var(--panel);stroke:var(--c);stroke-width:1.8}
.it.mor .cnt{fill:var(--c);font-size:14px;font-weight:700}
.it.mor .lab{pointer-events:auto}   /* "23 more" is what people aim at */
svg.dim .it.api:not(.hot) .bub,svg.dim .it.api:not(.hot) .lab,svg.dim .it.sub:not(.hot) .bub,svg.dim .it.sub:not(.hot) text,svg.dim .it.svc:not(.hot) .bub,svg.dim .it.svc:not(.hot) text{opacity:.3}
.it.nohit .bub,.it.nohit text,.it.nohit .sat{opacity:.25}
.it:hover .lab{text-decoration:underline;text-underline-offset:2px}
.it.pill:hover .lab,.it.hub:hover .lab{text-decoration:none}

/* links and tags */
.lnk{fill:none;stroke:var(--brick);stroke-width:1.8;opacity:.9}
.lnk.ref{stroke-dasharray:6 4}
.lnk.discovered{stroke-dasharray:1.5 4;stroke-linecap:round;stroke-width:2.2}
.lnk.faint{opacity:.28;stroke-width:1.1}
.tag{cursor:pointer;outline:none}
.tag text{font-size:12px;fill:var(--brick);font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.tag:hover text,.tag:focus-visible text{text-decoration:underline;text-underline-offset:2px}
.tag:focus-visible rect{stroke:var(--brick);stroke-width:2}
.tag rect{fill:transparent}

/* scenario route */
.rt{fill:none;stroke:var(--brick);stroke-linecap:round}
.rt.done{stroke-width:3.2}
.rt.todo{stroke-width:1.7;stroke-dasharray:6 5;opacity:.7}
.bdg rect{stroke:var(--brick);stroke-width:1.5}
.bdg.on rect{fill:var(--brick)}
.bdg.off rect{fill:var(--panel)}
.bdg text{font-size:11px;font-weight:700}
.bdg.on text{fill:#fff}
.bdg.off text{fill:var(--brick)}
.halo{fill:var(--brick);fill-opacity:.16;stroke:var(--brick);stroke-width:2}

/* key */
.key{position:absolute;z-index:2;left:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:4px 14px;max-width:calc(100% - 32px);font-size:12.5px;color:var(--mute);pointer-events:none}
.key span{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 85%,transparent);padding:1px 4px;border-radius:4px}
.key svg{width:26px;height:16px;flex:none}

/* hover card */
.tip{position:absolute;z-index:4;width:min(330px,calc(100% - 24px));background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.16);pointer-events:none;font-size:13.5px;line-height:1.45;display:none}
.tip.show{display:block}
.tip h3{margin:2px 0 6px;font-size:17px;line-height:1.2}
.tip p{margin:5px 0}
.tip .more{color:var(--mute);font-size:12.5px;margin-top:6px}

/* panel */
.wlname{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mute)}
.wlname i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.b{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--rule);white-space:nowrap}
.b.v1{border-color:var(--ink)}
.b.beta{border-color:var(--brick);color:var(--brick)}
.b.miss{background:var(--brick);border-color:var(--brick);color:#fff}
.b.legacy{border-color:var(--mute);color:var(--mute);text-decoration:line-through;text-decoration-thickness:1px}
.panel h2{font-size:25px;line-height:1.12;margin:6px 0 6px;text-wrap:balance}
.panel h4{font-size:13px;font-weight:700;margin:20px 0 6px;padding-top:12px;border-top:1px solid var(--rule)}
.panel h5{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:16px 0 4px;font-weight:700}
.panel p{margin:6px 0}
.panel ul{margin:4px 0;padding-left:18px}
.panel li{margin:4px 0}
.lead{font-size:15.5px}
.ep{background:var(--soft);border-radius:8px;padding:9px 12px;display:flex;gap:10px;align-items:start;justify-content:space-between;margin:10px 0}
.copy{border:1px solid var(--rule);background:var(--panel);border-radius:6px;font-size:12.5px;padding:3px 10px;min-height:30px;cursor:pointer;flex:none}
.perm{width:100%;border-collapse:collapse;font-size:14px}
.perm th{text-align:left;font-weight:500;color:var(--mute);width:92px;vertical-align:top;padding:6px 8px 6px 0}
.perm td{padding:6px 0;border-bottom:1px solid var(--rule)}
details.d{border-top:1px solid var(--rule)}
details.d>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:42px;font-size:14px;font-weight:700}
details.d>summary::-webkit-details-marker{display:none}
details.d>summary::after{content:"+";font-weight:400;color:var(--mute);font-size:18px}
details.d[open]>summary::after{content:"−"}
details.d>summary small{font-weight:400;color:var(--mute);margin-left:8px;margin-right:auto}
details.d>div{padding:0 0 12px}
details.d:last-of-type{border-bottom:1px solid var(--rule)}
.links{list-style:none;padding:0!important;margin:0}
.links li{margin:0}
.lk{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:8px 0;min-height:40px;cursor:pointer;font-size:14px}
.links li:last-child .lk{border-bottom:0}
.lk i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.lk>span{flex:1}
.lk small{color:var(--mute);margin-left:auto;text-align:right;font-size:12.5px;white-space:nowrap;padding-left:8px}
.lk .sv{display:block;color:var(--mute);font-size:12.5px;margin-top:1px}
.lk:hover b,.lk:hover>span:first-of-type{text-decoration:underline;text-underline-offset:3px}
.svlist .lk{align-items:start}
.svlist .lk i{margin-top:7px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.card{text-align:left;border:1px solid var(--rule);background:var(--soft);border-radius:10px;padding:12px 12px 14px;cursor:pointer;font-size:14px}
.card b{display:block;margin-bottom:3px}
.card span{color:var(--mute);font-size:13px;line-height:1.35;display:block}
.card:hover{border-color:var(--ink)}
.warn{color:var(--brick)}
.props{font-size:13px;color:var(--mute);columns:2;column-gap:14px;margin:6px 0 0}
details.sm summary{cursor:pointer;min-height:30px;font-size:13.5px}
.changes li{font-size:13.5px}
.changes time{color:var(--mute);font-size:12.5px;margin-right:6px;white-space:nowrap}
.foot{margin-top:22px;font-size:12.5px;color:var(--mute)}
.empty{padding:40px;color:var(--mute)}
.legacy-list{list-style:none;padding:0!important;margin:6px 0}
.legacy-list li{border-left:3px solid var(--rule);padding:4px 0 4px 10px;margin:8px 0}
.legacy-list small{display:block;color:var(--mute)}
.lfind{display:flex;gap:8px;align-items:center;margin:12px 0 4px}
.lfind input{flex:1;height:34px;border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:0 10px;font-size:14px}
.lfind select{height:34px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:8px;padding:0 6px;font:inherit;font-size:13.5px}
.lcount{color:var(--mute);font-size:12.5px;margin:4px 0}

/* scenarios */
.sclist{list-style:none;margin:0;padding:0!important}
.sclist li{margin:0}
.sclist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:8px 0;min-height:44px;cursor:pointer;font-size:14px}
.sclist li:last-child button{border-bottom:0}
.sclist button small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35}
.sclist button:hover,.sclist button:focus-visible{background:var(--soft)}
.scnav{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.scnav .of{margin-right:auto;font-weight:700}
.pbtn{border:1px solid var(--ink);background:var(--panel);border-radius:8px;font-size:14px;padding:4px 14px;min-height:34px;cursor:pointer}
.pbtn.solid{background:var(--ink);color:var(--bg)}
.pbtn:disabled{opacity:.4;cursor:default}
.back{border:0;background:none;padding:0;min-height:32px;cursor:pointer;color:var(--mute);font-size:13.5px}
.stepcard p{overflow-wrap:anywhere}
.stepcard{background:var(--soft);border-radius:10px;padding:12px 14px;margin:8px 0 4px}
.stepcard h3{margin:0;font-size:18px;line-height:1.2}
.stepcard .where{color:var(--mute);font-size:12.5px;margin:2px 0 8px}
.stepcard .alt{border-top:1px dashed var(--rule);margin-top:10px;padding-top:8px}
.sdl{display:grid;grid-template-columns:84px 1fr;gap:3px 8px;margin:6px 0 0;font-size:13.5px}
.sdl dt{color:var(--mute)}
.sdl dd{margin:0;overflow-wrap:anywhere}
.steps{list-style:none;margin:6px 0 0;padding:0!important}
.steps li{margin:0}
.steps button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:6px 0;min-height:40px;cursor:pointer;font-size:14px}
.steps button small{display:block;color:var(--mute);font-size:12px}
.num{flex:none;display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:12px;border:1.5px solid var(--brick);color:var(--brick);font-size:12px;font-weight:700}
.steps .done .num,.steps .cur .num{background:var(--brick);color:#fff}
.steps .cur button{font-weight:700}

/* coverage */
.bars{list-style:none;margin:6px 0;padding:0!important}
.bars li{display:grid;grid-template-columns:150px 1fr 78px;gap:8px;align-items:center;margin:5px 0;font-size:13.5px}
.bars .tr{height:12px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.bars .fill{height:100%;background:var(--c)}
.bars .fill.gen{background:var(--c);opacity:.45}
.bars .fill.beta{background:transparent;border:1.5px solid var(--c);border-left:0}
div.card{cursor:default}
div.card:hover{border-color:var(--rule)}
.bars .v{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:12.5px}
.bars button{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-size:13.5px;display:flex;gap:6px;align-items:center}
.bars button i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.cov{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.cov th{text-align:left;font-weight:500;color:var(--mute);padding:4px 6px 4px 0;border-bottom:1px solid var(--rule)}
.cov td{padding:4px 6px 4px 0;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.cov th:not(:first-child),.cov td:not(:first-child){text-align:right;white-space:nowrap}
</style>
</head>
<body>
<div class="narrow" role="note"><h1>M365 Graph Cartographer</h1><p>MGC is designed for desktop screens. Open it on a screen at least 1,000 pixels wide to explore the map.</p></div>
<div class="app">
<header class="top">
 <div class="brand"><b>MGC</b><span>M365 Graph Cartographer</span></div>
 <div class="seg" role="group" aria-label="View"><button data-view="explore" aria-pressed="true">Explore</button><button data-view="scen" aria-pressed="false">Scenarios</button><button data-view="cov" aria-pressed="false">Coverage</button></div>
 <div class="search"><input id="q" type="search" placeholder="Search APIs, paths, permissions" aria-label="Search APIs by name, path, permission or limitation" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="qres" aria-autocomplete="list"><ul class="qres" id="qres" role="listbox" hidden></ul></div>
 <button class="tbtn" id="fbtn" aria-expanded="false" aria-controls="fpanel">Filter<span class="n" id="fn" hidden></span></button>
 <button class="tbtn" id="reset" title="Back to the start">Reset<span class="dot" id="rdot" hidden></span></button>
 <div class="fpanel" id="fpanel" role="region" aria-label="Filters" hidden></div>
</header>
<div class="main">
 <div class="mapbox" id="mapbox">
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <svg id="map" role="group" aria-label="Expanding ring map of Microsoft Graph: services, sub-services and APIs"><g id="vp"><g id="guides"></g><g id="spokes"></g><g id="links"></g><g id="route"></g><g id="items"></g><g id="tags"></g></g></svg>
  <div class="tip" id="tip" role="status"></div>
  <div class="key" id="key" aria-label="Key"></div>
 </div>
 <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
</div>
<script>
{

s","scan":"v1.0"},{"s":"lifecycleWorkflow","t":"user","kind":"ref","label":"employeeHireDate / employeeLeaveDateTime","desc":"trigger on the user","scan":"n/a"},{"s":"lifecycleWorkflow","t":"packageAssignment","kind":"ref","label":"tasks","desc":"tasks can request or remove access package assignments","scan":"n/a"},{"s":"termsOfUse","t":"caPolicy","kind":"ref","label":"grantControls.termsOfUse","desc":"a Conditional Access policy requires acceptance","scan":"n/a"},{"s":"termsOfUse","t":"user","kind":"ref","label":"acceptances (userId)","scan":"n/a"},{"s":"pimGroups","t":"group","kind":"nav","nav":"group","scan":"v1.0"},{"s":"pimGroups","t":"user","kind":"ref","label":"principalId","scan":"n/a"},{"s":"consentRequest","t":"servicePrincipal","kind":"ref","label":"appId","scan":"n/a"},{"s":"consentRequest","t":"oauthGrant","kind":"ref","label":"approval","desc":"approving creates the grant","scan":"n/a"},{"s":"user","t":"consentRequest","kind":"nav","nav":"appConsentRequestsForApproval","scan":"beta only"}],"scenarios":[{"id":"secure-offboarding","label":"Secure offboarding","group":"Classic","summary":"A leaver's tokens, group access, app access, files and devices must all be cut off, not just the account disabled.","licence":"Entra ID (Free). Intune for device actions.","steps":[{"node":"user","do":"Block sign-in (accountEnabled false), then revoke refresh tokens and session cookies.","call":"POST /users/{id}/revokeSignInSessions","permission":"User.RevokeSessions.All (delegated and application)","note":"Revocation can take a few minutes, and access tokens already issued stay valid until they expire (usually about an hour)."},{"node":"group","do":"List memberOf and remove the user from groups, especially role-assignable and privileged ones.","call":"GET /users/{id}/memberOf","note":"Dynamic group membership can't be removed by hand; it drops when the user's attributes change."},{"node":"appRoleAssignment","do":"Remove the user's direct enterprise app assignments.","call":"GET /users/{id}/appRoleAssignments","note":"The list includes assignments through groups the user is a direct member of; remove those through the group."},{"node":"drive","do":"Find the OneDrive and hand its content to the manager before the retention period runs out.","call":"GET /users/{id}/drive","note":"Setting the OneDrive access delegate (the manager) is a SharePoint admin setting, not a Graph call."},{"node":"device","do":"Find the user's registered and owned devices and disable or retire them.","call":"GET /users/{id}/ownedDevices","note":"Wipe and retire are Intune actions on managedDevice (/deviceManagement), not on the Entra device object."}],"seeAlso":["leaver-event-retention","custodian-legal-hold"],"seeAlsoNote":{"custodian-legal-hold":"Do this first: put the leaver on hold before you block sign-in, remove licences or delete the OneDrive.","leaver-event-retention":"Fire the leaver event so their content is kept for the right period."}},{"id":"privileged-access-review","label":"Privileged access review","group":"Classic","summary":"Standing admin roles are the biggest identity risk; a review should cover active and eligible assignments and how they are used.","licence":"Entra ID P2 or ID Governance for PIM. Entra ID P1 for sign-in logs.","steps":[{"node":"directoryRole","do":"List active directory roles and their members.","call":"GET /directoryRoles?$expand=members","note":"Only activated roles appear here. Use roleManagement/directory/roleAssignments for the full picture."},{"node":"pimEligibility","do":"List eligible assignments: who can activate which role, and when that ends."},{"node":"user","do":"Check each holder: still employed, a cloud-only admin account, MFA registered.","call":"GET /users/{id}?$select=accountEnabled,onPremisesSyncEnabled,signInActivity","permission":"User.Read.All + AuditLog.Read.All (signInActivity)"},{"node":"administrativeUnit","do":"Check roles scoped to administrative units, which a tenant-wide review misses.","call":"GET /directory/administrativeUnits/{id}/scopedRoleMembers"},{"node":"signIn","do":"Look for admin sign-ins without MFA or from unusual places.","call":"GET /auditLogs/signIns?$filter=userId eq '{id}'"}]},{"id":"risky-app-consent","label":"Risky app consent review","group":"Classic","summary":"Consent phishing and over-permissioned apps give attackers durable access that survives password resets.","licence":"Entra ID (Free). Entra ID P1 for sign-in logs.","steps":[{"node":"application","do":"List apps registered in your tenant and their requested permissions (requiredResourceAccess)."},{"node":"servicePrincipal","do":"List enterprise apps, including multi-tenant apps from other publishers.","call":"GET /servicePrincipals?$select=id,appId,displayName,appOwnerOrganizationId,verifiedPublisher"},{"node":"oauthGrant","do":"Find delegated grants with broad scopes (Mail.Read, Files.Read.All and so on), and whether they are admin or per-user consent."},{"node":"appRoleAssignment","do":"Find application permissions granted to each app: these work without a signed-in user.","call":"GET /servicePrincipals/{id}/appRoleAssignments","note":"Application permissions on Microsoft Graph are app role assignments whose resourceId is the Graph service principal."},{"node":"signIn","do":"Check whether the app is actually used, and from where.","call":"GET /beta/auditLogs/signIns?$filter=signInEventTypes/any(t: t eq 'servicePrincipal')","note":"Service principal sign-ins are beta only; v1.0 returns interactive user sign-ins."}]},{"id":"guest-external-access","label":"Guest and external access review","group":"Classic","summary":"Guests and shared channels quietly widen who can see your content; access should be reviewed where it is granted.","licence":"Entra ID (Free). Access reviews need ID Governance or P2.","steps":[{"node":"user","do":"List guest accounts and when they last signed in.","call":"GET /users?$filter=userType eq 'Guest'&$select=displayName,mail,signInActivity","permission":"User.Read.All + AuditLog.Read.All (signInActivity)"},{"node":"group","do":"Find which groups and Microsoft 365 groups each guest belongs to.","call":"GET /users/{id}/memberOf"},{"node":"team","do":"List the teams behind those groups and their guest settings."},{"node":"channel","do":"Find shared channels, whose members can come from other tenants without a guest account.","call":"GET /teams/{id}/channels?$filter=membershipType eq 'shared'","note":"Shared-channel members from other tenants are not guests, so a guest review misses them."},{"node":"site","do":"Find the sites behind those teams and channels (shared channels have their own site)."},{"node":"permission","do":"List sharing links and direct grants, especially anyone and external links.","call":"GET /drives/{id}/items/{id}/permissions"}]},{"id":"compromised-account","label":"Compromised account investigation","group":"Classic","summary":"Business email compromise moves fast; you need the alert, the sign-ins, the persistence (rules) and the containment in one sweep.","licence":"Microsoft Defender XDR. Entra ID P2 for risky users. Entra ID P1 for sign-in logs.","steps":[{"node":"incident","do":"Open the Defender XDR incident and its correlated alerts."},{"node":"alert","do":"Read the alert evidence: user, mailbox, IP addresses, files."},{"node":"riskyUser","do":"Check the user's risk level and history; confirm compromise to feed ID Protection.","call":"POST /identityProtection/riskyUsers/confirmCompromised","permission":"IdentityRiskyUser.ReadWrite.All"},{"node":"signIn","do":"Review sign-ins for the period: locations, apps, MFA results, legacy protocols."},{"node":"directoryAudit","do":"Look for changes the attacker made: MFA methods added, app consents, role changes.","call":"GET /auditLogs/directoryAudits?$filter=initiatedBy/user/id eq '{id}'"},{"node":"messageRule","do":"Look for Inbox rules that forward, redirect, delete or hide mail."},{"node":"hunting","do":"Hunt across mail, identity and cloud app events for the same IP addresses and patterns.","note":"Advanced hunting keeps 30 days of data."},{"node":"user","do":"Contain: block sign-in, reset the password and revoke sessions.","call":"POST /users/{id}/revokeSignInSessions","permission":"User.RevokeSessions.All"}]},{"id":"dormant-licensed-accounts","label":"Dormant accounts with active licences","group":"Classic","summary":"Unused accounts are an attack surface and a cost; licences on them are money spent for nothing.","licence":"Entra ID P1 for signInActivity.","steps":[{"node":"user","do":"List users with their last successful sign-in and assigned licences.","call":"GET /users?$select=displayName,accountEnabled,assignedLicenses,signInActivity","permission":"User.Read.All + AuditLog.Read.All","note":"signInActivity can lag by up to 24 hours, and lastSuccessfulSignInDateTime has no data before December 2023."},{"node":"signIn","do":"Confirm inactivity for borderline accounts; non-interactive sign-ins (beta) show background use.","note":"Sign-in logs are kept for 30 days, so use signInActivity for anything older."},{"node":"subscribedSku","do":"Map skuId to product names and see consumed against purchased units."},{"node":"group","do":"Find group-based licence assignments; remove the user from the group rather than the licence.","call":"GET /groups?$filter=assignedLicenses/$count ne 0&$count=true","note":"Needs ConsistencyLevel: eventual. Licence errors are written to the user asynchronously."},{"node":"reportRoot","do":"Confirm per-workload inactivity (mail, OneDrive, Teams) from the activity reports.","call":"GET /reports/getOffice365ActiveUserDetail(period='D90')","note":"Reports show concealed names unless the tenant setting is turned off."}]},{"id":"external-mail-forwarding","label":"Mail forwarding to external addresses","group":"Classic","summary":"Auto-forwarding is a classic exfiltration route, and it can be set in places Graph can't see.","licence":"Exchange Online. Defender XDR for alerts and hunting.","steps":[{"node":"user","do":"List mailbox users in scope.","call":"GET /users?$filter=mail ne null&$select=id,mail"},{"node":"messageRule","do":"For each mailbox, find Inbox rules with forwardTo, redirectTo or forwardAsAttachmentTo outside your domains.","note":"Reading every mailbox's rules app-only needs MailboxSettings.Read for the whole tenant; scope it with RBAC for Applications if you can."},{"node":"exGap","do":"Check mailbox forwarding, the outbound spam policy, remote domains and transport rules in Exchange Online PowerShell.","call":"Get-Mailbox · Get-HostedOutboundSpamFilterPolicy · Get-RemoteDomain · Get-TransportRule","permission":"Exchange Online PowerShell role (for example View-Only Organization Management)"},{"node":"alert","do":"Look for forwarding alerts, such as suspicious email forwarding activity.","call":"GET /security/alerts_v2?$filter=title has 'forward'"},{"node":"hunting","do":"Hunt for mail actually leaving to external recipients.","call":"POST /security/runHuntingQuery (EmailEvents, where EmailDirection == 'Outbound')"}]},{"id":"copilot-oversharing","label":"Oversharing check before Copilot rollout","group":"AI","summary":"Copilot surfaces whatever a user can already open, so overshared sites become Copilot answers.","licence":"Microsoft 365 Copilot. SharePoint Advanced Management for its oversharing reports.","steps":[{"node":"site","do":"List sites and spot broadly shared ones (Everyone except external users, large Members groups).","call":"GET /sites/getAllSites","note":"getAllSites needs application permissions."},{"node":"permission","do":"List site and file permissions and sharing links, especially organisation-wide and anyone links."},{"node":"driveItem","do":"Find sensitive files in those sites (search or by library) and their labels.","call":"POST /search/query (entityTypes: driveItem)"},{"node":"sensitivityLabel","do":"Check which labels exist and apply or raise labels on sensitive content.","call":"POST /drives/{id}/items/{id}/assignSensitivityLabel","note":"assignSensitivityLabel is a metered API, and app-only calls can't replace the content of a labelled file."},{"node":"reportRoot","do":"Track Copilot readiness and usage after rollout.","call":"GET /reports/getMicrosoft365CopilotUsageUserDetail(period='D30')","note":"Check Learn for the current Copilot usage report endpoints; some are beta."}]},{"id":"purview-dlp-own-ai","label":"Apply Purview DLP to your own AI apps","group":"AI","summary":"Home-grown AI apps can leak data like any other; the Purview APIs let them honour the same DLP and labels as Microsoft 365.","licence":"Pay-as-you-go billing for Entra-registered AI apps. Purview DLP licensing for the policies.","steps":[{"node":"user","do":"Identify the user the app acts for (delegated) or will act for (application)."},{"node":"purviewAi","do":"Compute protection scopes, then send each prompt and response to processContent and honour the verdict.","call":"POST /users/{id}/dataSecurityAndGovernance/protectionScopes/compute, then processContent","note":"Cache the compute ETag and send it as If-None-Match; call compute again when protectionScopeState is modified."},{"node":"sensitivityLabel","do":"Read the labels that apply to the content the app retrieves, so it can respect encryption and usage rights.","call":"GET /users/{id}/dataSecurityAndGovernance/sensitivityLabels"},{"node":"alert","do":"DLP matches from your app surface as alerts for the security team.","call":"GET /security/alerts_v2?$filter=serviceSource eq 'dataLossPrevention'"}]},{"id":"copilot-interaction-review","label":"Copilot interaction export and review","group":"AI","summary":"Prompts and responses are business records; you may need to export, review, retain or hold them.","licence":"Microsoft 365 Copilot. Purview (eDiscovery Premium) for review sets and holds.","steps":[{"node":"user","do":"Pick the users in scope; only Copilot-licensed users have history."},{"node":"aiInteraction","do":"Export prompts and responses for a date range, filtered by app if needed.","call":"GET /copilot/users/{id}/interactionHistory/getAllEnterpriseInteractions?$filter=createdDateTime gt {start} and createdDateTime lt {end}"},{"node":"driveItem","do":"Follow contexts and attachments to the files Copilot used."},{"node":"message","do":"Or to the mails and chats it used.","or":true},{"node":"retentionLabel","do":"Keep the interactions under a retention policy for Copilot interactions.","note":"Copilot retention is set by retention policy in Purview, not by labelling each interaction through Graph."},{"node":"ediscoveryCase","do":"Or put the users on hold and collect Copilot interactions into a case.","or":true}]},{"id":"audit-hunt-ai-usage","label":"Audit and hunt AI usage","group":"AI","summary":"Security teams need to see who uses AI, on what data, and spot misuse such as prompt-based exfiltration.","licence":"Purview Audit (Standard). Defender XDR (with Defender for Cloud Apps) for CloudAppEvents.","steps":[{"node":"auditLogQuery","do":"Search the unified audit log for CopilotInteraction records.","call":"POST /security/auditLog/queries (recordTypeFilters: CopilotInteraction)","note":"Audit queries run asynchronously; poll the query status, then read its records."},{"node":"hunting","do":"Hunt in CloudAppEvents for AI app activity across users.","call":"POST /security/runHuntingQuery (CloudAppEvents, where ActionType == 'CopilotInteraction')"},{"node":"user","do":"Pivot to the users with unusual volume or access patterns."},{"node":"alert","do":"Check for related alerts, such as DLP or insider risk on AI activity."}]},{"id":"agent-identity-governance","label":"Agent identity governance","group":"AI","summary":"AI agents now have their own identities; they need an owner, least privilege, Conditional Access and monitoring like any workforce identity.","licence":"Microsoft Agent 365 (in Microsoft 365 E7) plus Entra ID P1 for Conditional Access on agents. Drifting; checked 16 Nov 2026.","steps":[{"node":"agentBlueprint","do":"Inventory blueprints and their owners and sponsors."},{"node":"agentIdentity","do":"List agent identities and the blueprint each came from.","call":"GET /servicePrincipals/microsoft.graph.agentIdentity"},{"node":"caPolicy","do":"Check that a Conditional Access policy targets agent identities or their blueprints.","note":"Policies for all users don't include agent users; agents need explicit targeting (preview)."},{"node":"oauthGrant","do":"Review delegated and application permissions granted to agents.","call":"GET /servicePrincipals/{id}/oauth2PermissionGrants"},{"node":"signIn","do":"Monitor agent sign-ins.","call":"GET /beta/auditLogs/signIns?$filter=signInEventTypes/any(t: t eq 'servicePrincipal') and agent/agentType eq 'AgentIdentity'","note":"The agent property on sign-ins is beta only."}]},{"id":"leaver-event-retention","label":"Event-based retention for leavers","group":"Purview","summary":"A leaver's records must be kept for a set time from the day they leave, not from when each file was created.","licence":"Event-based retention and disposition review: Microsoft 365 or Office 365 E5/A5/G5, Purview Suite, or E5 Information Protection and Governance (Purview service description, checked 16 Nov 2026).","seeAlso":["secure-offboarding"],"steps":[{"node":"user","do":"Get the leaver's employee ID; it is the asset ID that tags their content.","call":"GET /users/{id}?$select=employeeId,employeeLeaveDateTime","note":"Content must carry the asset ID (the Compliance Asset Id column) before the event fires, or it won't be matched."},{"node":"retentionLabel","do":"Use a label whose retention starts on an event (retentionTrigger dateOfEvent), bound to an Employee leaving event type.","note":"Delegated only. The event type can't be changed once the label is saved."},{"node":"retentionEvent","do":"Create a retention event of that type with an asset ID query, for example AssetID:<employee ID>.","call":"POST /security/triggers/retentionEvents","permission":"RecordsManagement.ReadWrite.All","note":"eventQueries match SharePoint and OneDrive by asset ID and Exchange by keywords."},{"node":"driveItem","do":"Check the event-based label is applied to the leaver's files.","call":"GET /drives/{id}/items/{id}/retentionLabel"},{"node":"dispositionReview","do":"At the end of the period, reviewers approve deletion in the Purview portal.","note":"Reviewers need the Disposition Management role; auditing must be on."}]},{"id":"custodian-legal-hold","label":"Legal hold on a departing custodian","group":"Purview","summary":"If a leaver may be part of litigation, their mailbox and files must be preserved before anything is removed.","licence":"Microsoft 365 E3 for cases, custodians, searches and holds with delegated calls. E5 or an equivalent eDiscovery add-on for review sets and app-only calls.","seeAlso":["secure-offboarding"],"steps":[{"node":"ediscoveryCase","do":"Open or create the case.","call":"POST /security/cases/ediscoveryCases","permission":"eDiscovery.ReadWrite.All","note":"Delegated callers also need the eDiscovery Manager or eDiscovery Administrator role."},{"node":"custodian","do":"Add the leaver as a custodian with their mailbox and OneDrive, plus the sites and groups they used.","call":"POST /security/cases/ediscoveryCases/{id}/custodians, then userSources, siteSources, unifiedGroupSources","permission":"eDiscovery.ReadWrite.All"},{"node":"legalHold","do":"Put the custodian on hold before sign-in is blocked, licences are removed or the OneDrive is deleted.","call":"POST /security/cases/ediscoveryCases/{id}/custodians/{id}/applyHold","note":"applyHold is v1.0 and asynchronous; the legalHolds list is beta only in $metadata."},{"node":"ediscoverySearch","do":"Search the custodian's sources and estimate the volume.","call":"POST /security/cases/ediscoveryCases/{id}/searches/{id}/estimateStatistics"},{"node":"reviewSet","do":"Collect the results into a review set and export them.","call":"POST /security/cases/ediscoveryCases/{id}/reviewSets/{id}/addToReviewSet, then export","note":"On E3 there are no review sets, and export needs pay-as-you-go billing."}]},{"id":"dlp-incident-triage","label":"DLP incident triage","group":"Purview","summary":"A DLP alert is only the start; triage needs the matching activity, the content, its label and what was detected.","licence":"DLP alert investigation: Microsoft 365 or Office 365 E5/A5, E5 Compliance, or E5 Information Protection and Governance. Audit (Standard) covers 180 days.","steps":[{"node":"alert","do":"List DLP alerts and pick one to triage.","call":"GET /security/alerts_v2?$filter=serviceSource eq 'dataLossPrevention'","note":"Single-event DLP alerts work on any DLP subscription; aggregated alerts need E5-class licences."},{"node":"auditLogQuery","do":"Query the audit log for DLP rule matches around the alert time.","call":"POST /security/auditLog/queries (recordTypeFilters: ComplianceDLPSharePoint, ComplianceDLPExchange, DLPEndpoint)"},{"node":"auditRecord","do":"Read the records: who, which file or message, which rule and what action was taken."},{"node":"driveItem","do":"For SharePoint and OneDrive matches, open the file and who it is shared with."},{"node":"message","do":"For Exchange matches, find the email.","or":true},{"node":"messageTrace","do":"And trace where the email went.","or":true,"call":"GET /admin/exchange/tracing/messageTraces?$filter=receivedDateTime ge {start} and receivedDateTime le {end} and senderAddress eq '{address}'"},{"node":"sensitivityLabel","do":"Check the content's label and whether it was downgraded or removed.","call":"POST /drives/{id}/items/{id}/extractSensitivityLabels"},{"node":"sensitiveType","do":"Identify which sensitive info types matched.","note":"The matched SITs are in the DLP audit record; the sensitiveTypes list itself is beta and undocumented."}]}],"recentChanges":[{"date":"2026-11-23","node":"agentIdentity","kind":"props-added","text":"Agent identity: new v1.0 property 'lif         if (focus && (e.s === focus || e.t === focus)) return;
        const key = [A.k, B.k].sort().join('|') + e.kind; if (seen.has(key)) return; seen.add(key);
        const [p, q] = trimmed(posOf(A.t), A.t.size + 2, posOf(B.t), B.t.size + 2);
        h += `<path class="lnk faint ${e.kind === 'ref' ? 'ref' : e.kind === 'discovered' ? 'discovered' : ''}" d="${curve(p, q)}"/>`;
      });
    }
    const tagsAt = {};
    if (focus && L.m.get('api:' + focus)) {
      const self = L.m.get('api:' + focus);
      edges.filter(e => edgeOn(e) && (e.s === focus || e.t === focus)).forEach(e => {
        const other = e.s === focus ? e.t : e.s, B = anchorOf(other); if (!B || B.k === 'api:' + focus) return;
        const [p, q] = trimmed(posOf(self), API_R + 2, posOf(B.t), (B.t.mode === 'pill' ? 10 : B.t.size) + 2);
        h += `<path class="lnk ${e.kind === 'ref' ? 'ref' : e.kind === 'discovered' ? 'discovered' : ''}" d="${curve(p, q)}"/>`;
        if (!B.direct) { (tagsAt[B.k] ||= {t: B.t, ids: []}); if (!tagsAt[B.k].ids.includes(other)) tagsAt[B.k].ids.push(other); }
      });
    }
    gLinks.innerHTML = h;
    // "↳ API name" tags on the inner side of the ancestor that stands in for a hidden API
    let th = '';
    Object.values(tagsAt).forEach(({t, ids}) => {
      const a = t.a + L.rot, c = Math.cos(rad(a));
      const [x, y] = polar(a, t.r - (t.mode === 'pill' ? 10 : t.size) - 9);
      const anchor = c > 0.34 ? 'end' : c < -0.34 ? 'start' : 'middle';
      const s = Math.sin(rad(a)), dir = anchor === 'middle' ? (s > 0 ? -1 : 1) : 1;
      const y0 = anchor === 'middle' ? y + (s > 0 ? -4 : 12) : y - (ids.length - 1)*8 + 4;
      ids.forEach((id, i) => {
        const txt = '↳ ' + N[id].label, w = tw(txt, 12, 700), yy = y0 + i*16*dir;
        const bx = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w/2;
        th += `<g class="tag" data-go="${esc(id)}" tabindex="0" role="button" aria-label="Open ${esc(N[id].label)}"><rect x="${(bx - 3).toFixed(1)}" y="${(yy - 12).toFixed(1)}" width="${(w + 6).toFixed(1)}" height="16" rx="3"/><text x="${x.toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="${anchor}">${esc(txt)}</text></g>`;

      edges.filter(e => edgeOn(e) && (e.s === focus || e.t === focus)).forEach(e => { const B = anchorOf(e.s === focus ? e.t : e.s); if (B) hot.add(B.k); });

    items.forEach(it => it.g.classList.toggle('hot', hot.has(it.key)));
    svg.classList.toggle('dim', !!S.hover && hot.size > 1);
  }

  /* ================= scenario route ================= */
  function drawRoute(){
    gLinks.innerHTML = ''; gTags.innerHTML = '';
    const sid = S.preview || S.scen, s = SC[sid]; if (!s) return;
    const preview = !!S.preview && S.preview !== S.scen, groups = scenGroups(s), cur = preview ? -1 : S.step;
    let h = '';
    const pos = id => { const t = L.m.get('api:' + id); return t ? {t, a: t.a + L.rot, p: posOf(t)} : null; };
    for (let i = 0; i < groups.length - 1; i++) for (const A of groups[i]) for (const B of groups[i + 1]) {
      if (A.node === B.node) continue;
      const p = pos(A.node), q = pos(B.node); if (!p || !q) continue;
      const done = !preview && i + 1 <= cur, cls = `rt ${done ? 'done' : 'todo'}`;
      const d = norm(q.a - p.a);
      if (Math.abs(d) < 50) {   // short hop: an arc just outside the ring, in the channel before the labels
        const rr = R3 + API_R + 7, [x1, y1] = polar(p.a, rr), [x2, y2] = polar(q.a, rr), [o1, j1] = polar(p.a, R3 + API_R + 1), [o2, j2] = polar(q.a, R3 + API_R + 1);

      } else {
        const [a1, a2] = trimmed(p.p, API_R + 3, q.p, API_R + 3);

      }

    // number badges, on the inner side of each step
    L.m.forEach(t => {
      if (!t.nums) return;
      const it = items.get(t.k), bg = badgeGeom(t, L.rot), [x, y] = posOf(t);
      const on = !preview && Math.min(...t.nums) <= cur + 1;
      it.bdg.setAttribute('class', 'bdg ' + (on ? 'on' : 'off'));
      it.bdg.innerHTML = `<rect x="${(bg.x - x - bg.w/2).toFixed(1)}" y="${(bg.y - y - 9).toFixed(1)}" width="${bg.w.toFixed(1)}" height="18" rx="9"/><text x="${(bg.x - x).toFixed(1)}" y="${(bg.y - y + 3.8).toFixed(1)}" text-anchor="middle">${bg.txt}</text>`;
    });
    items.forEach(it => it.g.classList.remove('hot'));

  }

  /* ================= key ================= */
  const ks = (inner, text) => `<span><svg viewBox="0 0 26 16" aria-hidden="true">${inner}</svg>${text}</span>`;
  function updateKey(){
    let h = ks('<circle cx="8" cy="8" r="4" fill="var(--mute)"/><circle cx="19" cy="8" r="6.5" fill="var(--mute)"/>', svcList().some(w => apisOf(w.id).length > SVC_CAP) ? `Bubble size: number of APIs (${SVC_CAP} or more share the largest size)` : 'Bubble size: number of APIs');

    } else if (S.sel || S.hover || F.allLinks) {
      h += ks('<path d="M2 12Q13 1 24 12" class="lnk"/>', 'Relationship or action') + ks('<path d="M2 12Q13 1 24 12" class="lnk ref"/>', 'Reference by ID');
      if (F.disc) h += ks('<path d="M2 12Q13 1 24 12" class="lnk discovered"/>', 'Found by the scanner');
    }

    if (L && [...L.m.keys()].some(k => k.startsWith('mor:'))) h += ks('<circle cx="13" cy="8" r="6.5" style="fill:var(--panel);stroke:var(--mute);stroke-width:1.8"/><text x="13" y="12.2" text-anchor="middle" style="fill:var(--mute);font-size:12px;font-weight:700">+</text>', 'More in the list');

      ks('<circle cx="13" cy="8" r="4" fill="var(--mute)"/><circle cx="13" cy="8" r="7" style="fill:none;stroke:var(--mute);stroke-width:1.6;stroke-dasharray:3 2"/>', 'Legacy API');

    $('#key').innerHTML = h;
  }

  /* ================= breadcrumb ================= */

    const c = [];
    const b = (go, txt) => `<button data-crumb="${esc(go)}">${esc(txt)}</button>`;

        c.push(b('scen-top', s.label));

      c.push(b('start', 'Microsoft Graph'), b('cov', 'Coverage'));

  /* ================= actions ================= */
  function sync(opts){ relayout(opts); crumbs(); renderPanel(); writeHash(); updateReset(); }

  function openSub(w, s){

  // A click, tap or Enter on a ring item.

  // "+n more": show the sub-service's full list in the panel and put the cursor in its filter box.
  function openList(w, s){

  }

  let pvTimer = null;

  /* ================= panel ================= */
  const ul = items_ => items_ && items_.length ? `<ul>${items_.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p>None recorded yet.</p>';
  const docsLink = u => u ? `<p><a href="${esc(u)}" target="_blank" rel="noopener">Microsoft Learn reference ↗</a></p>` : '';

  function renderStart(){

      <ul class="links svlist">${svcList().map(w => `<li><button class="lk" data-svc="${w.id}" style="--c:${w.colour}"><i></i><span><b>${esc(w.label)}</b><span class="sv">${subsOf(w.id).map(s => esc(s.label)).join(' · ')}</span></span><small>${apisOf(w.id).length ? pl(apisOf(w.id).length, 'API') : 'not mapped yet'}</small></button></li>`).join('')}</ul>
      <div class="cards"><button class="card" data-act="search"><b>Search for a resource</b><span>By name, path, permission or limitation.</span></button><button class="card" data-act="scen"><b>Walk through a scenario</b><span>${SCEN.length} step-by-step routes for reviews and investigations.</span></button></div>

  }
  function renderSvc(w){

      <h5>Sub-services</h5><ul class="links">${subsOf(w.id).map(s => { const a = apisOf(w.id, s.id); return `<li><button class="lk" data-sub="${w.id}/${s.id}" style="--c:${w.colour}"><i></i><span><b>${esc(s.label)}</b><span class="sv">${a.length ? names(a) : 'Not mapped yet'}</span></span><small>${a.length ? pl(a.length, 'API') : ''}</small></button></li>`; }).join('')}</ul>

  function listRows(){
    const [wid, sid] = LIST.key.split('/'), w = WL[wid], {all, hidden} = ringApis(wid, sid), off = new Set(hidden.map(n => n.id));

    const ids = t ? new Set(searchHits(t).map(h => h.n.id)) : null;
    items.forEach(it => {
      if (!ids || !it.t || it.type === 'hub') { if (!svg.classList.contains('dim')) it.g.style.removeProperty('filter'); it.g.classList.remove('nohit'); return; }
      const t2 = it.t;
      const has = it.type === 'api' ? ids.has(t2.id) : it.type === 'mor' ? ringApis(t2.w, t2.s).hidden.some(n => ids.has(n.id)) : it.type === 'sub' ? apisOf(t2.w, t2.s).some(n => ids.has(n.id)) : apisOf(t2.w).some(n => ids.has(n.id));
      it.g.classList.toggle('nohit', !has);
    });
  }

  /* ================= reset ================= */
  function isStart(){
    const d = DEFAULT_FILTERS();
    return S.view === 'explore' && !S.svc && !S.sub && !S.sel && !S.scen && !q.value && !touched &&
      !F.hidden.size && F.allLinks === d.allLinks && F.status === d.status && F.disc === d.disc && F.changed === d.changed && F.gaps === d.gaps;
  }
  function updateReset(){ $('#rdot').hidden = isStart(); }
  $('#reset').addEventListener('click', () => {
    F = DEFAULT_FILTERS(); q.value = ''; closeResults(); toggleFilters(false); renderFilters(); hideTip();
    touched = false; S.view = 'explore'; S.svc = S.sub = S.sel = S.scen = S.preview = S.hover = null; S.step = 0; setSeg();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    sync({refit: true});
  });

  /* ================= hover card ================= */
  function tipHtml(key){
    const it = items.get(key), t = it.t;
    if (it.type === 'hub') return `<h3>${esc(hub.label)}</h3><p>${esc(hub.summary)}</p><p class="more">Click to go back to the start</p>`;
    if (it.type === 'svc') { const w = WL[t.w], c = apisOf(w.id).length; return `${wlName({...w, label: FAMILIES[w.family] || ''})}<h3>${esc(w.label)}</h3><p>${esc(w.summary)}</p><p>${subsOf(w.id).map(s => esc(s.label)).join(' · ')}</p><p class="more">${c ? pl(c, 'API') : 'Not mapped yet'} · click to open</p>`; }
    if (it.type === 'sub') { const a = apisOf(t.w, t.s); return `${wlName(WL[t.w])}<h3>${esc(t.lab)}</h3><p>${a.length ? a.slice(0, 12).map(n => esc(n.label)).join(' · ') + (a.length > 12 ? ` and ${a.length - 12} more` : '') : 'Nothing is mapped here yet.'}</p><p class="more">Click to open</p>`; }
    if (it.type === 'mor') { const h = ringApis(t.w, t.s).hidden; return `${wlName(WL[t.w], (SUBS[t.w].find(x => x.id === t.s) || {}).label)}<h3>${pl(h.length, 'more API')}</h3><p>${h.slice(0, 8).map(n => esc(n.label)).join(' · ')}${h.length > 8 ? ' …' : ''}</p><p class="more">Click to list them all</p>`; }
    const n = N[t.id], p = n.permissions || {};
    return `${wlName(WL[n.workload], (subOf(n.id) || {}).label)}<h3>${esc(n.label)}</h3>${badges(n)}${n.path ? `<p><code>${esc(n.path)}</code></p>` : ''}` +
      (p.delegated ? `<p><b>Delegated:</b> ${esc(p.delegated)}<br><b>Application:</b> ${esc(p.application)}</p>` : `<p>${esc(n.summary)}</p>`) +
      (n.limits && n.limits[0] ? `<p><b>Watch for:</b> ${esc(n.limits[0])}</p>` : '') +
      (t.nums ? `<p class="more">Step ${t.nums.join(' and ')} · click to go to the step</p>` : '<p class="more">Click for full notes</p>');
  }
  function showTip(key, ev){
    tip.className = 'tip show'; tip.innerHTML = tipHtml(key);
    const r = box.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = ev.clientX - r.left + 18, y = ev.clientY - r.top + 18;
    if (x + w > r.width - 8) x = ev.clientX - r.left - w - 18;
    if (y + h > r.height - 8) y = Math.max(8, r.height - h - 8);
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = y + 'px';
  }
  function hideTip(){ tip.className = 'tip'; }
  function setHover(id){
    if (S.hover === id) return;
    S.hover = id;
    if (!(S.view === 'scen' && (S.scen || S.preview))) { drawLinks(); updateKey(); }
  }
  svg.addEventListener('pointerover', e => {
    if (e.pointerType !== 'mouse' || downAt) return;
    const g = e.target.closest('.it'); if (!g || g.classList.contains('off')) return;
    const it = items.get(g.dataset.k);
    showTip(g.dataset.k, e);
    if (it.type === 'api') setHover(it.t.id);
  });
  svg.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || downAt || !tip.classList.contains('show')) return;
    const g = e.target.closest('.it'); if (g) showTip(g.dataset.k, e);
  });
  svg.addEventListener('pointerout', e => {
    if (e.pointerType !== 'mouse') return;
    const g = e.target.closest('.it'); if (!g || g.contains(e.relatedTarget)) return;
    hideTip(); setHover(null);
  });

  /* ================= keyboard ================= */
  function siblings(it){
    const grp = x => x.type === 'mor' ? 'api' : x.type, type = grp(it);
    const list = [...items.values()].filter(x => x.t && grp(x) === type && (type !== 'sub' || x.t.w === it.t.w || S.view === 'scen') && x.t.mode !== undefined);
    return list.sort((p, q2) => norm(p.cur.a + 90) - norm(q2.cur.a + 90));
  }
  svg.addEventListener('keydown', e => {
    const g = e.target.closest('.it'), tg = e.target.closest('.tag');
    if (tg && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectApi(tg.dataset.go); return; }
    if (!g) return;
    const it = items.get(g.dataset.k);
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const k = it.key; activate(k); focusKey(k); return; }
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key) && it.type !== 'hub') {
      e.preventDefault();
      const sib = siblings(it), i = sib.indexOf(it), d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1;
      const nx = sib[(i + d + sib.length) % sib.length];
      if (nx) { nx.g.focus(); if (nx.type === 'api') setHover(nx.t.id); }
    }
  });
  svg.addEventListener('focusin', e => { const g = e.target.closest('.it'); if (g && items.get(g.dataset.k).type === 'api') setHover(items.get(g.dataset.k).t.id); });
  svg.addEventListener('focusout', () => setHover(null));
  // After a relayout, keep focus on the item that was activated (or its replacement).
  function focusKey(k){ requestAnimationFrame(() => { const it = items.get(k); if (it && it.t) it.g.focus({preventScroll: true}); }); }
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!fpanel.hidden) { toggleFilters(false); fbtn.focus(); return; }
    if (e.target === q) return;
    const had = document.activeElement && document.activeElement.closest && document.activeElement.closest('.it');
    stepBack(); hideTip();
    if (had) { const k = S.sub ? `sub:${S.svc}/${S.sub}` : S.svc ? 'svc:' + S.svc : 'hub'; focusKey(k); }
  });
  gTags.addEventListener('click', e => { const t = e.target.closest('.tag'); if (t) selectApi(t.dataset.go); });

  /* ================= pan, zoom and the pointer fix =================
     Only the primary mouse button (or touch and pen) starts a pan or a click. endGesture() drops any half-finished
     gesture whenever pointerup may never arrive: right-click (context menu), lost capture, the pointer leaving the
     window, window blur, the tab being hidden, or a mouse move with no buttons held. */
  const ptrs = new Map(); let downAt = null, moved = false, pinch = null, downTarget = null;
  function endGesture(){
    ptrs.clear(); pinch = null; downAt = null; moved = false; downTarget = null;
    svg.classList.remove('drag');
  }
  function zoomBy(f, px, py){
    const W = box.clientWidth, H = box.clientHeight;
    px = px ?? W/2; py = py ?? H/2;
    const k = Math.max(.3, Math.min(4, view.k*f));
    view.tx = px - (px - view.tx)*(k/view.k); view.ty = py - (py - view.ty)*(k/view.k); view.k = k; touched = true; applyView(); updateReset();
  }
  svg.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;   // primary button only; touch and pen always
    if (e.target.closest('.tag')) return;
    try { svg.setPointerCapture(e.pointerId); } catch (_) { /* pointer already gone */ }
    ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (ptrs.size === 1) { downAt = {x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty}; moved = false; downTarget = e.target.closest('.it'); }
    if (ptrs.size === 2) { const [p, q2] = [...ptrs.values()]; pinch = {d: Math.hypot(p.x - q2.x, p.y - q2.y), k: view.k}; moved = true; }
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    if (e.pointerType === 'mouse' && e.buttons === 0) { endGesture(); return; }   // button released where we could not see it
    ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (ptrs.size === 2 && pinch) {
      const [p, q2] = [...ptrs.values()], r = box.getBoundingClientRect();
      zoomBy((pinch.k*Math.hypot(p.x - q2.x, p.y - q2.y)/pinch.d)/view.k, (p.x + q2.x)/2 - r.left, (p.y + q2.y)/2 - r.top);
      return;
    }
    if (!downAt) return;
    const dx = e.clientX - downAt.x, dy = e.clientY - downAt.y;
    if (!moved && Math.hypot(dx, dy) > 5) { moved = true; svg.classList.add('drag'); hideTip(); }
    if (moved) { view.tx = downAt.tx + dx; view.ty = downAt.ty + dy; touched = true; applyView(); updateReset(); }
  });
  const up = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size) return;
    svg.classList.remove('drag');
    if (!moved && downAt && downTarget && !downTarget.classList.contains('off')) { hideTip(); activate(downTarget.dataset.k); }
    downAt = null; downTarget = null;
  };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);
  svg.addEventListener('lostpointercapture', e => {
    // Fires after a normal pointerup too, by which time the pointer is already gone from ptrs.
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (!ptrs.size) endGesture();
  });
  svg.addEventListener('contextmenu', endGesture);
  document.documentElement.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') endGesture(); });
  window.addEventListener('blur', endGesture);
  document.addEventListener('visibilitychange', () => { if (document.hidden) endGesture(); });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = box.getBoundingClientRect();
    zoomBy(Math.exp(-e.deltaY*0.0015), e.clientX - r.left, e.clientY - r.top);
  }, {passive: false});

  /* ================= hash routing =================
     #<nodeId> selects an API (opening its service and sub-service), #svc/<workload>[/<subservice>] opens a branch,
     #scenario-<id> starts a scenario. */
  let lastHash = null;
  function hashFor(){
    if (S.view === 'scen' && S.scen) return '#scenario-' + S.scen;
    if (S.view !== 'explore') return '';
    if (S.sel) return '#' + S.sel;
    if (S.sub) return `#svc/${S.svc}/${S.sub}`;
    if (S.svc) return '#svc/' + S.svc;
    return '';
  }
  function writeHash(){
    const h = hashFor(); lastHash = h;
    if ((location.hash || '') === h) return;
    try { history.replaceState(null, '', h || location.pathname + location.search); } catch (e) {}
  }
  function route(raw){
    const h = decodeURIComponent((raw || '').replace(/^#/, ''));
    if (!h) { goStart(); return; }
    if (h.startsWith('scenario-') && SC[h.slice(9)]) { startScenario(h.slice(9)); return; }
    if (h.startsWith('svc/')) {
      const [w, s] = h.slice(4).split('/');
      if (WL[w]) { if (s && SUBS[w].some(x => x.id === s)) openSub(w, s); else openSvc(w); return; }
    }
    if (N[h]) { selectApi(h); return; }
    goStart();
  }
  window.addEventListener('hashchange', () => { if ((location.hash || '') !== lastHash) route(location.hash); });

  /* ================= start ================= */
  let lw = 0, lh = 0;
  new ResizeObserver(() => {
    const W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    if (W !== lw || H !== lh) { lw = W; lh = H; if (L) relayout({instant: true, refit: !touched}); }
  }).observe(box);
  renderFilters();
  route(location.hash);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in mcache) delete mcache[k]; relayout({instant: true}); });

  /* Layout self-check, for development: MGC.check() walks every Explore state (each service, each sub-service)
     and every scenario, and returns any label, bubble or badge that overlaps another, or a drawing that needs more
     room than the map has. It uses the same boxes the page uses to place and fit everything. */
  window.MGC = {
    check(){
      const saved = {...S}, out = [];
      const W = box.clientWidth, H = box.clientHeight;
      const test = name => {
        const {out: o, all} = problems(L), b = bounds(all);
        const k = Math.min((W - 40)/(b.x1 - b.x0), (H - 88)/(b.y1 - b.y0));
        o.forEach(x => out.push(`${name}: ${x}`));
        if (k < 0.55) out.push(`${name}: needs scale ${k.toFixed(2)} to fit (minimum 0.55)`);
        return k;
      };
      const scales = {};
      S.view = 'explore'; S.scen = S.preview = null;
      S.svc = S.sub = null; L = resolveLabels(layoutExplore()); scales.start = test('start');
      svcList().forEach(w => {
        S.svc = w.id; S.sub = null; L = resolveLabels(layoutExplore()); scales[w.id] = test(w.id);
        subsOf(w.id).forEach(s => { S.sub = s.id; L = resolveLabels(layoutExplore()); scales[w.id + '/' + s.id] = test(`${w.id}/${s.id}`); });
      });
      S.view = 'scen';
      SCEN.forEach(s => { S.scen = s.id; L = bestScenario(s); scales['scenario-' + s.id] = test('scenario-' + s.id); });
      Object.assign(S, saved); relayout({instant: true});
      return {problems: out, minScale: Math.min(...Object.values(scales)).toFixed(2), scales};
    }
  };
}
}
</script>
</body>
