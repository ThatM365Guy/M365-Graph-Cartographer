# Alternative to the Function App: a weekly GitHub Actions run that rescans,
# commits the updated data and publishes dist/index.html to GitHub Pages.
name: MGC schema scan
on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
  push:
    paths: ["data/curated.json", "web/template.html"]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover tests
      - run: python scanner/scan.py --curated data/curated.json --out data/graph-map.json --changelog data/changelog.json
      - run: python scanner/build_page.py --data data/graph-map.json --template web/template.html --out dist/index.html
      - name: Commit refreshed data
        run: |
          git config user.name "mgc-bot"
          git config user.email "mgc-bot@users.noreply.github.com"
          git add data/graph-map.json data/changelog.json
          git diff --cached --quiet || git commit -m "Scan $(date -u +%F)" && git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/deploy-pages@v4
