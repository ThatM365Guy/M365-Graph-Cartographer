# Alternative to the Function App: a weekly GitHub Actions run that rescans,
# commits the updated data and publishes dist/index.html to GitHub Pages.
name: MGC schema scan
on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]   # work branches don't deploy; the github-pages environment only allows main
    paths: ["data/curated.json", "web/template.html"]
# One scan at a time: a run queues behind the one in progress instead of racing it to push to main.
concurrency:
  group: mgc-scan
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python -m unittest discover tests
      - run: python scanner/scan.py --curated data/curated.json --out data/graph-map.json --changelog data/changelog.json --coverage data/coverage.json
      - run: python scanner/build_page.py --data data/graph-map.json --template web/template.html --out dist/index.html
      - name: Commit refreshed data
        run: |
          git config user.name "mgc-bot"
          git config user.email "mgc-bot@users.noreply.github.com"
          git add data/graph-map.json data/changelog.json data/coverage.json data/generated.json
          if ! git diff --cached --quiet; then
            git commit -m "Scan $(date -u +%F)"
            git pull --rebase origin main   # main may have moved while the scan ran
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v5
